  return 'Buen día'+(name?' '+name:'')+'. Soy familia de '+nameOf().replace(/ \(ejemplo\)$/,'')+'. ¿Nos ayuda a confirmar si entregó «'+t.title+'»'+(subj(t.subject)?' de '+subj(t.subject).name:'')+' (entrega '+fmtDate(t.due)+')? Es un solo toque, sin instalar nada:\n'+link+'\n¡Muchas gracias!';
}
function askTeacher(tid){
  var t=S.tasks.filter(function(x){return x.id===tid})[0];if(!t)return;
  var s=subj(t.subject),k='sf.teacher.'+(t.subject||''),saved=lsGet(k)||'';
  var key=vKey(curSid,tid),link=lsGet('sf.tlink.'+key);
  if(link){showTeacherLink(t,lsGet('sf.tname.'+key)||'',link);return}
  openModal('<h3>Pedir confirmación al docente</h3><p class="muted" style="margin:0">Se crea un link único para esta actividad. El docente solo ve el nombre de '+esc(nameOf().split(' ')[0])+' y la actividad, nada más. Vence en 7 días.</p>'+
    '<label for="tn">Nombre del docente (opcional)</label><input id="tn" maxlength="60" value="'+esc(saved||(s&&s.teacher)||'')+'" placeholder="Ej. Prof. Ruiz">'+
    '<div class="row" style="margin-top:16px"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn famb" id="tnok" style="margin-left:auto">Crear link</button></div>');
  $('#tnok').onclick=function(){
    var name=$('#tn').value.trim().slice(0,60),b=this;lsSet(k,name);b.disabled=true;
    if(SAMPLE){var tok='demo-'+uid();var l=appLink()+'?t='+tok;lsSet('sf.tlink.'+key,l);lsSet('sf.tname.'+key,name);(demo.treqs||(demo.treqs={}))[tok]={tid:tid,name:name};showTeacherLink(t,name,l,tok);return}
    if(typeof F!=='function'||!F()||!F().teacherReq){b.disabled=false;toast('El link para docentes funciona en la versión con cuentas.');return}
    F().teacherReq({studentId:curSid,taskId:tid,title:t.title,subject:s?s.name:'',due:t.due,teacherName:name}).then(function(r){
      var l=appLink()+'?t='+r.token;lsSet('sf.tlink.'+key,l);lsSet('sf.tname.'+key,name);showTeacherLink(t,name,l);
    },function(e){b.disabled=false;toast('No se pudo crear el link. Revisa tu conexión.')});
  };
}
function showTeacherLink(t,name,link,demoTok){
  var msg=teacherMsg(t,name,link);
  openModal('<h3>Link para el docente</h3><p class="muted" style="margin:0">Envíaselo por WhatsApp o correo. Cuando responda, verás el resultado en esta actividad.</p>'+
    '<div class="linkbox">'+esc(link)+'</div>'+
    '<div class="row wrap" style="gap:8px;margin-top:10px"><a class="btn famb" href="https://wa.me/?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Enviar por WhatsApp</a><button class="btn ghost" id="tlcopy">Copiar mensaje</button></div>'+
    (demoTok?'<div class="sample" style="margin-top:12px">Demostración: así lo verá el docente. <button class="btn small" id="tldemo">Ver como docente</button></div>':'')+
    '<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="tv-back" data-id="'+esc(t.id)+'">Volver</button></div>');
  $('#tlcopy').onclick=function(){try{navigator.clipboard.writeText(msg).then(function(){toast('Mensaje copiado ✅')},function(){toast('No se pudo copiar; mantén presionado el link para copiarlo.')})}catch(e){toast('No se pudo copiar.')}};
  if(demoTok)$('#tldemo').onclick=function(){teacherDemo(t,name)};
}

function teacherBind(onSend){
  var sel='';
  Array.prototype.forEach.call(document.querySelectorAll('[data-tr]'),function(b){if(b.classList.contains('on'))sel=b.dataset.tr;b.onclick=function(){sel=b.dataset.tr;Array.prototype.forEach.call(document.querySelectorAll('[data-tr]'),function(x){x.classList.toggle('on',x===b)})}});

function teacherDemo(t,name){

/* Resumen semanal y revisión al azar para la familia */
function weekDoneTasks(){var lim=shift(ymd(new Date()),-7);return S.tasks.filter(function(t){return t.done&&(t.doneAt||t.due)>=lim})}
function randomPicks(){
  var l=weekDoneTasks().filter(function(t){return !fcOf(curSid,t.id)&&!tcOf(curSid,t.id)});
  var seed=0,w=mondayOf(new Date())+curSid;for(var i=0;i<w.length;i++)seed=(seed*31+w.charCodeAt(i))>>>0;
  return l.map(function(t){var h=seed;for(var j=0;j<t.id.length;j++)h=(h*33+t.id.charCodeAt(j))>>>0;return {t:t,h:h}}).sort(function(a,b){return a.h-b.h}).slice(0,3).map(function(x){return x.t});
}
function validationCard(){
  if(MODE!=='parent'||!curSid)return '';
  var l=weekDoneTasks(),fam=0,doc=0,bad=0;
  l.forEach(function(t){var r=trustOf(t,curSid);if(!r)return;if(r.k===2)fam++;if(r.k===3)doc++;if(r.k<0)bad++});
  var picks=randomPicks();
  var out='<div class="card fam"><h2>'+ic('check')+'Validación de actividades</h2><p class="muted" style="margin:-4px 0 10px">Últimos 7 días. Revisa el cuaderno o pide al docente que confirme.</p>'+
    '<div class="vstats"><button data-act="tv-list" data-id="all"><b>'+l.length+'</b><span>🟡 marcadas</span></button><button data-act="tv-list" data-id="fam"><b>'+fam+'</b><span>🔵 vistas por ti</span></button><button data-act="tv-list" data-id="doc"><b>'+doc+'</b><span>🟢 docente</span></button><button data-act="tv-list" data-id="bad"><b>'+bad+'</b><span>❌ no hechas</span></button></div><p class="muted" style="font-size:12px;margin:6px 0 0;text-align:center">Toca un número para ver esas actividades.</p>';
  if(picks.length){
    out+='<div class="reto-h" style="margin-top:12px;color:var(--fam)">🎲 Revisión al azar de esta semana</div><div class="muted" style="margin-bottom:4px">'+esc(nameOf().split(' ')[0])+' no sabe cuáles se van a revisar; así conviene ser honesto con todas.</div>';
    picks.forEach(function(t){var s=subj(t.subject),ev=evOf(curSid,t.id);out+='<div class="item"><span class="dot" style="background:'+(s?s.color:'#999')+'"></span><div class="grow"><div class="title">'+esc(t.title)+'</div><div class="muted">'+(s?esc(s.name)+' · ':'')+(ev?(ev.hasImg?'📷 con foto':'📝 con nota'):'sin evidencia')+'</div></div><button class="btn famb small" data-act="tv-open" data-id="'+esc(t.id)+'">Revisar</button></div>'});
  }else if(l.length)out+='<div class="empty">Ya revisaste lo de esta semana. 👏</div>';
  else out+='<div class="empty">Esta semana todavía no marca actividades como hechas.</div>';
  if(l.length&&doc+fam<l.length&&bad===0)out+='';
  if(bad)out+='<div class="evc late" style="margin-top:10px"><div class="evc-e">🤝</div><div>Hay '+bad+' '+plural(bad,'actividad marcada','actividades marcadas')+' como hecha que no se pudo confirmar. Conversen qué pasó, sin regaños: la idea es que diga la verdad la próxima vez.</div></div>';
  return out+'</div>';
}
function validAction(a,id,el){
  var p=String(id||'').split('|');
  if(a==='tv-list'){tvListModal(p[0]);return}
  if(a==='tv-open')TVBACK=p[1]&&p[1].indexOf('list:')===0?p[1].slice(5):'';
  if(a==='tv-open'||a==='tv-back')tvModal(p[0]);
  else if(a==='tv-fam')setFam(p[0],p[1]);

}
/* ---------- Movimiento, niveles y celebraciones ----------
   Criterio: lo que se toca muchas veces al día se mueve poco y rápido;
   la celebración grande se guarda para momentos especiales (terminar, subir de nivel). */
var EASE_OUT='cubic-bezier(0.23, 1, 0.32, 1)';
var MOTION={key:'',reduce:false,t:0};
try{var mq=window.matchMedia('(prefers-reduced-motion: reduce)');MOTION.reduce=mq.matches;mq.addEventListener&&mq.addEventListener('change',function(e){MOTION.reduce=e.matches})}catch(e){}
function canAnim(el){return !!(el&&el.animate)}
/* Al entrar a una pantalla: las tarjetas aparecen en cascada, las barras y gráficas crecen y los números cuentan.
   Solo cuando cambia la pantalla; si los datos se actualizan solos, no se repite. */
function afterRender(){
  var key=MODE+'|'+view+'|'+(MODE==='parent'?curSid:'')+'|'+(SAMPLE?1:0);
  if(key===MOTION.key)return;
  MOTION.key=key;
  var v=$('#view');if(!v||!canAnim(v))return;
  var kids=Array.prototype.slice.call(v.children,0,10);
  kids.forEach(function(el,i){
    el.animate(MOTION.reduce?[{opacity:0},{opacity:1}]:[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],
      {duration:MOTION.reduce?160:280,delay:MOTION.reduce?0:i*45,easing:EASE_OUT,fill:'backwards'});
  });
  if(MOTION.reduce)return;
  Array.prototype.forEach.call(v.querySelectorAll('.bar>i,.rk-bar i,.xp-bar i'),function(b,i){
    b.animate([{clipPath:'inset(0 100% 0 0 round 99px)'},{clipPath:'inset(0 0 0 0 round 99px)'}],{duration:520,delay:120+Math.min(i*40,320),easing:EASE_OUT,fill:'backwards'});
  });
  Array.prototype.forEach.call(v.querySelectorAll('svg rect'),function(r,i){
    r.animate([{transform:'scaleY(0.04)',opacity:0},{transform:'none',opacity:1}],{duration:460,delay:120+Math.min(i*28,420),easing:EASE_OUT,fill:'backwards'});
  });
  Array.prototype.forEach.call(v.querySelectorAll('svg circle[stroke-dasharray]'),function(c){
    var d=c.getAttribute('stroke-dasharray'),p=String(d).split(' ');if(p.length<2)return;
    c.animate([{strokeDasharray:'0 '+p[1]},{strokeDasharray:d}],{duration:700,delay:150,easing:EASE_OUT,fill:'backwards'});
  });
  countUp(v);
}
function countUp(root){
  var els=root.querySelectorAll('.big,.mini b,.rk-pts,.vstats b,.xp-num,.ring-n,svg text.ringv');
  Array.prototype.forEach.call(els,function(el){
    var node=el.firstChild;if(!node||node.nodeType!==3)return;
    var m=/^(\d{1,6})(%?)$/.exec(node.nodeValue.trim());if(!m)return;
    var to=+m[1],suf=m[2];if(to<2)return;
    var t0=performance.now(),dur=Math.min(900,420+to*4);
    node.nodeValue='0'+suf;
    (function step(now){var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);node.nodeValue=Math.round(to*e)+suf;if(k<1)requestAnimationFrame(step)})(t0);
  });
}
/* Confeti: pequeño al terminar algo, grande para logros especiales. Con «reducir movimiento» no se muestra. */
function celebrate(size,from){
  if(MOTION.reduce)return;
  var cv=document.createElement('canvas'),dpr=Math.min(2,window.devicePixelRatio||1),W=window.innerWidth,H=window.innerHeight;
  cv.className='confetti';cv.width=W*dpr;cv.height=H*dpr;document.body.appendChild(cv);
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var cs=getComputedStyle(document.documentElement),cols=['--primary','--accent','--ok','--fam','--bad'].map(function(k){return cs.getPropertyValue(k).trim()||'#1f8ef1'});
  var big=size==='big',n=big?140:46,ox=W/2,oy=H*0.35;
  if(from&&from.getBoundingClientRect){var r=from.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2}
  var P=[];for(var i=0;i<n;i++){var a=big?Math.random()*Math.PI*2:-Math.PI/2+(Math.random()-.5)*1.9,sp=(big?7:5)+Math.random()*(big?7:4);
    P.push({x:big?W*Math.random():ox,y:big?-20-Math.random()*H*0.3:oy,vx:big?(Math.random()-.5)*3:Math.cos(a)*sp,vy:big?2+Math.random()*3:Math.sin(a)*sp,
      w:5+Math.random()*6,h:7+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*0.4,c:cols[i%cols.length]})}
  var t0=performance.now(),life=big?1900:1100;
  (function frame(now){
    var k=(now-t0)/life;ctx.clearRect(0,0,W,H);
    P.forEach(function(p){p.vy+=big?0.06:0.22;p.vx*=0.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.globalAlpha=Math.max(0,1-Math.max(0,k-0.6)/0.4);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*(0.55+0.45*Math.abs(Math.sin(p.r*2))));ctx.restore()});
    if(k<1)requestAnimationFrame(frame);else cv.remove();
  })(t0);
}
/* Puntos de experiencia (XP) y nivel del estudiante */
var LV_TITLES=[[1,'🌱','Semilla'],[2,'📘','Aprendiz'],[3,'🔎','Explorador'],[5,'🧠','Estudioso'],[7,'🚀','Experto'],[10,'🏅','Maestro'],[15,'👑','Leyenda']];
function xpOf(){
  var sid=sidOf(),xp=0,today=ymd(new Date()),xt=0;
  S.tasks.forEach(function(t){if(!t.done||rejected(t))return;var v=10,r=trustOf(t,sid);if(r&&r.k===2)v+=5;if(r&&r.k===3)v+=10;xp+=v;if(t.doneAt===today)xt+=v});
  S.sessions.forEach(function(s){var m=Math.round(+s.minutes||0);xp+=m;if(s.date===today)xt+=m});
  choresOf(sid).forEach(function(c){Object.keys(c.checked||{}).forEach(function(d){if(c.checked[d]==='ok'){xp+=chorePts(c);if(d===today)xt+=chorePts(c)}})});
  return {xp:xp,today:xt};
}
function lvFor(xp){var n=1;while(50*(n+1)*n<=xp)n++;return n}
function lvBase(n){return 50*n*(n-1)}
function lvTitle(n){var t=LV_TITLES[0];LV_TITLES.forEach(function(x){if(n>=x[0])t=x});return t}
var MOTTOS=['Un poquito cada día gana más que mucho de vez en cuando.','Equivocarse es parte de aprender. ¡Sigue!','Hoy es buen día para tachar una tarea.','Tu yo de mañana te va a agradecer lo que hagas hoy.','Pregúntale al tutor lo que no entiendas: para eso está.','La racha se cuida un día a la vez. 🔥','Termina lo difícil primero y lo demás se siente fácil.'];
function levelCard(){
  if(MODE!=='student')return '';
  var x=xpOf(),lv=lvFor(x.xp),b=lvBase(lv),nx=lvBase(lv+1),pct=Math.round((x.xp-b)/(nx-b)*100),tt=lvTitle(lv),st=streak();
  var motto=MOTTOS[(new Date().getDate()+lv)%MOTTOS.length];
  return '<div class="card lvc"><div class="lvc-top"><div class="lvc-badge"><span class="lvc-e">'+tt[1]+'</span><span class="lvc-n">Nivel <b class="xp-num">'+lv+'</b></span></div>'+
    '<div class="grow"><div class="lvc-t">'+esc(tt[2])+'</div><div class="muted">'+esc(motto)+'</div></div>'+
    (st?'<div class="lvc-fire" title="'+esc(st+' '+plural(st,'día','días')+' de racha')+'"><span>🔥</span><b>'+st+'</b></div>':'')+'</div>'+
    '<div class="xp-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="Avance al siguiente nivel"><i style="width:'+pct+'%"></i></div>'+
    '<div class="row between" style="margin-top:6px;font-size:13px"><span class="muted"><b class="xp-num">'+x.xp+'</b> XP'+(x.today?' · +'+x.today+' hoy':'')+'</span><span class="muted">Te faltan '+(nx-x.xp)+' XP para el nivel '+(lv+1)+'</span></div></div>';
}
function checkLevelUp(){
  if(MODE!=='student')return;
  var lv=lvFor(xpOf().xp),prev=+(S.settings.lvl||0);
  if(!prev){S.settings.lvl=lv;if(!SAMPLE)save();return}
  if(lv>prev){
    S.settings.lvl=lv;if(!SAMPLE)save();
    var tt=lvTitle(lv);
    setTimeout(function(){
      celebrate('big');
      openModal('<div class="lvup"><div class="lvup-e">'+tt[1]+'</div><h3>¡Subiste al nivel '+lv+'!</h3><p class="muted">Ahora eres <b>'+esc(tt[2])+'</b>. Cada tarea, minuto de estudio y tarea de la casa confirmada te da XP.</p><button class="btn block" data-act="close">¡Genial!</button></div>');
    },350);
  }else if(lv<prev){S.settings.lvl=lv;if(!SAMPLE)save()}
}

  var remText=(t.reminders||[]).filter(function(r){return r&&r.at}).map(function(r){var d=new Date(r.at);return isNaN(d.getTime())?'':d.toLocaleString(LOC,{dateStyle:'short',timeStyle:'short'})}).filter(Boolean);
  return '<div class="item '+(t.done?'done':'')+'">'+toggle+'<div class="grow"><div class="title">'+esc(t.title)+'</div><div class="muted">'+esc(t.subjectName||t.subject||'Actividad')+' · '+esc(t.type||'Tarea')+' · '+prio+'</div>'+(t.note?'<div class="muted" style="margin-top:3px">'+esc(t.note)+'</div>':'')+(remText.length?'<div class="muted" style="margin-top:4px">🔔 Recordatorios: '+remText.map(esc).join(' · ')+'</div>':'')+'</div>'+badge+'</div>';
}
var DEFAULT_ACTIVITY_TYPES=['Tarea','Examen','Proyecto','Lectura','Exposición','Repaso','Actividad'];
function activityTypeNames(){
  var names=[],seen={};
  DEFAULT_ACTIVITY_TYPES.concat(activityTypes.map(function(t){return t.name||''})).forEach(function(raw){
    var n=String(raw||'').trim().replace(/\s+/g,' '),k=n.toLocaleLowerCase();
    if(n&&!seen[k]){seen[k]=true;names.push(n)}
  });
  return names;
}
function activityTypeOptions(selected){
  var names=activityTypeNames();if(selected&&names.indexOf(selected)<0)names.push(selected);
  return names.map(function(n){return '<option value="'+esc(n)+'"'+(n===selected?' selected':'')+'>'+esc(n)+'</option>'}).join('');
}

function sortedPending(){
  var w={alta:0,media:1,baja:2};
  return S.tasks.filter(function(t){return !t.done}).sort(function(a,b){
    if(a.due!==b.due)return a.due<b.due?-1:1;
    return (w[a.prio]==null?1:w[a.prio])-(w[b.prio]==null?1:w[b.prio]);
  });
}

function peerScore(st){
  var d=st&&st.data||{}, grades=Array.isArray(d.grades)?d.grades:[], tasks=Array.isArray(d.tasks)?d.tasks:[], exams=tasks.filter(function(t){return /examen/i.test(t.title||t.type||'')});
  var vals=grades.map(function(g){var n=Number(g.score!=null?g.score:g.grade);return isFinite(n)?n:null}).filter(function(n){return n!==null});
  var avg=vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:0;
  var total=tasks.length, done=tasks.filter(function(t){return t.done||t.doneAt}).length;
  var ext=assignedTasks.filter(function(t){return t.student===st.id}); total+=ext.length;done+=ext.filter(function(t){return t.done}).length;
  var taskPct=total?done/total*100:0;
  var examAvg=exams.length?exams.reduce(function(a,t){return a+(Number(t.score)||0)},0)/exams.length:0;
  return {points:Math.round(avg*0.5+taskPct*0.35+examAvg*0.15),avg:avg,taskPct:taskPct,total:total,done:done};
}

function checkAssignedReminders(){
  if(MODE!=='student'||!assignedTasks||!assignedTasks.length)return;
  var now=Date.now();
  assignedTasks.filter(function(t){return t.student===mySid&&!t.done}).forEach(function(t){
    remList(t).forEach(function(r){
      var at=remTime(r);if(!at||at>now)return;
      var key='sf.arem.'+t.id+'.'+(r.id||r.at);if(lsGet(key))return;lsSet(key,'1');
      if(now-at<12*3600e3)fireNotice('Recordatorio: '+t.title,(t.subjectName||t.type||'Actividad')+' · '+daysLeftText(t.due)+' ('+fmtDate(t.due)+')');
    });
  });
}
function upcomingRemsAll(days){
  var l=upcomingRems(days),now=Date.now(),lim=now+days*864e5;
  assignedTasks.filter(function(t){return t.student===mySid&&!t.done}).forEach(function(t){remList(t).forEach(function(r){var x=remTime(r);if(x>now&&x<=lim)l.push({t:t,r:r,x:x,a:true})})});
  return l.sort(function(a,b){return a.x-b.x});
}

/* ---------- Grupos de estudio entre familias (flujo completo) ----------
   1) El estudiante pide entrar con el código.
   2) Su madre/padre autoriza desde su cuenta.
   3) El creador del grupo acepta.
   4) Solo entonces el estudiante publica su resumen mínimo: nombre, avatar, puntos,
      tareas completadas, racha y minutos de estudio (nunca notas ni tareas). */
var GRP={loading:false,loaded:false,ids:[],reqs:[],groups:{},members:{},requests:{},removed:[],t:0};
var GCH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function R(){return F().root}
function uidMe(){return AUTH.user&&AUTH.user.uid}
function gErr(e){var c=e&&(e.code||e.message)||'';return /permission/.test(c)?'No tienes permiso para esto. Revisa que las reglas nuevas estén publicadas.':'No se pudo completar. Revisa tu conexión.'}
function myGroupStats(){return myWeekStats()}
function memberData(isNew){

    grade:String(S.settings.grade||AUTH.prof.grade||'').slice(0,30),points:s.points,tasksDone:s.tasksDone,streak:s.streak,studyMin7:s.studyMin7,week:s.week,updatedAt:Date.now()};
  if(isNew)d.joinedAt=Date.now();
  return d;
}
function userRef(){return R().doc('users/'+uidMe())}
function saveUserGroups(){
  return userRef().get().then(function(d){
    var x=d.exists?d.data():{};x.studyGroupIds=GRP.ids.slice(0,30);x.groupReqs=GRP.reqs.slice(0,30);
    return userRef().set(x);
  });
}
async function syncGroups(force){
  if(MODE!=='student'||!AUTH.user||!F().root||GRP.loading)return;
  if(!force&&GRP.loaded&&Date.now()-GRP.t<60000)return;
  GRP.loading=true;
  try{
    var u=await userRef().get(),x=u.exists?u.data():{};
    GRP.ids=(x.studyGroupIds||[]).slice(0,30);GRP.reqs=(x.groupReqs||[]).slice(0,30);
    var changed=false;
    // Revisar solicitudes pendientes
    for(var i=0;i<GRP.reqs.length;i++){
      var q=GRP.reqs[i];
      try{
        var r=await R().doc('studyGroups/'+q.gid+'/requests/'+uidMe()).get();
        q.status=r.exists?r.data().status:'gone';
        if(q.status==='accepted'){
          await R().doc('studyGroups/'+q.gid+'/members/'+uidMe()).set(memberData(true));
          if(GRP.ids.indexOf(q.gid)<0)GRP.ids.push(q.gid);
          q.done=true;changed=true;
          toast('¡Entraste al grupo «'+q.name+'»! 🎉');
        }
      }catch(e){q.status='gone'}
    }
    var keepReqs=GRP.reqs.filter(function(q){return !q.done});
    if(keepReqs.length!==GRP.reqs.length){GRP.reqs=keepReqs;changed=true}
    // Cargar grupos y ranking
    GRP.groups={};GRP.members={};GRP.requests={};
    var still=[];
    for(var j=0;j<GRP.ids.length;j++){
      var gid=GRP.ids[j];
      try{
        var g=await R().doc('studyGroups/'+gid).get();
        if(!g.exists)throw 0;
        var gd=Object.assign({id:gid},g.data());GRP.groups[gid]=gd;still.push(gid);
        if(gd.ownerUid!==uidMe()){
          var myReq=await R().doc('studyGroups/'+gid+'/requests/'+uidMe()).get();
          if(!myReq.exists||myReq.data().status!=='accepted'){
            await R().doc('studyGroups/'+gid+'/members/'+uidMe()).delete().catch(function(){});
            throw 0;
          }
        }
        await R().doc('studyGroups/'+gid+'/members/'+uidMe()).update(memberData(false));
        var ms=await R().collection('studyGroups/'+gid+'/members').get();
        GRP.members[gid]=ms.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (b.points||0)-(a.points||0)});
        if(gd.ownerUid===uidMe()){
          var rq=await R().collection('studyGroups/'+gid+'/requests').get();
          GRP.requests[gid]=rq.docs.map(function(d){return Object.assign({id:d.id},d.data())});
        }
      }catch(e){changed=true;GRP.removed.push(gid)}
    }
    if(still.length!==GRP.ids.length){GRP.ids=still;changed=true}
    if(changed)await saveUserGroups();
  }catch(e){}
  GRP.loading=false;GRP.loaded=true;GRP.t=Date.now();softRender();
}

    var ap=familyGroupApprovals.filter(function(x){return x.id===id})[0];if(!ap)return;

      var rq={status:st};rq[st==='authorized'?'authorizedAt':st==='rejected'?'rejectedAt':'revokedAt']=Date.now();
      R().doc('studyGroups/'+ap.groupId+'/requests/'+ap.studentUid).update(rq).catch(function(){})
        .then(function(){return st==='revoked'?R().doc('studyGroups/'+ap.groupId+'/members/'+ap.studentUid).delete().catch(function(){}):null})
        .then(function(){return DB.doc('groupApprovals/'+id).update(upd)})
        .then(function(){toast(st==='authorized'?'Permiso dado ✓. Falta que el creador del grupo lo acepte.':st==='rejected'?'Solicitud rechazada':'Permiso retirado. Ya no comparte su progreso en ese grupo.')},writeErr);
    };

  }
}

function chart(gs){
  if(gs.length<2)return '<div class="empty">Se necesitan al menos 2 notas para ver la gráfica.</div>';
  var W=320,H=150,pl=28,pb=18,pt=8,pr=8,n=gs.length;
  var x=function(i){return pl+i*(W-pl-pr)/(n-1)};
  var y=function(p){return pt+(H-pt-pb)*(1-Math.max(0,Math.min(100,p))/100)};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfica de notas">';
  [0,50,100].forEach(function(v){svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="2" y="'+(y(v)+3)+'">'+r1(toScale(v))+'</text>'});
  var gy=y(S.settings.goal);
  svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ok)" stroke-dasharray="4 4"/>';
  svg+='<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" points="'+gs.map(function(g,i){return x(i)+','+y(pct(g))}).join(' ')+'"/>';
  gs.forEach(function(g,i){var s=subj(g.subject);svg+='<circle cx="'+x(i)+'" cy="'+y(pct(g))+'" r="4.5" fill="'+(s?s.color:'var(--primary)')+'" stroke="var(--card)" stroke-width="1.5"><title>'+esc(g.name)+': '+g.score+'/'+g.max+'</title></circle>'});
  return svg+'</svg><div class="muted">Línea verde punteada = meta</div>';
}
function barChart(n){
  var data=[];for(var i=n-1;i>=0;i--){var d=today();d.setDate(d.getDate()-i);var k=ymd(d);
    data.push({d:d,m:sum(S.sessions.filter(function(s){return s.date===k}).map(function(s){return +s.minutes||0}))})}
  var daily=S.settings.weekly/7,mx=Math.max(daily,10);data.forEach(function(x){mx=Math.max(mx,x.m)});
  var W=320,H=130,pl=6,pr=6,pt=8,pb=18,bw=(W-pl-pr)/n,gap=n>10?1.5:6;
  var y=function(v){return pt+(H-pt-pb)*(1-v/mx)};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Minutos de estudio por día">';
  data.forEach(function(x,i){
    var h=(H-pt-pb)*x.m/mx,X=pl+i*bw+gap/2;
    svg+='<rect x="'+X+'" y="'+(H-pb-h)+'" width="'+(bw-gap)+'" height="'+Math.max(h,x.m?2:0)+'" rx="'+(n>10?1.5:4)+'" fill="'+(x.m>=daily?'var(--ok)':'var(--primary)')+'"><title>'+x.d.toLocaleDateString(LOC,{day:'numeric',month:'short'})+': '+x.m+' min</title></rect>';
    var lab=n<=7?DOWS()[x.d.getDay()]:((n-1-i)%5===0?String(x.d.getDate()):'');
    if(lab)svg+='<text x="'+(X+(bw-gap)/2)+'" y="'+(H-4)+'" text-anchor="middle">'+lab+'</text>';
  });
  svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(daily)+'" y2="'+y(daily)+'" stroke="var(--ok)" stroke-dasharray="4 4"/>';
  return svg+'</svg><div class="muted">Verde = día con la meta diaria cumplida (~'+Math.round(daily)+' min, línea punteada)</div>';
}
function ring(score){
  var r=42,c=2*Math.PI*r,v=score==null?0:Math.max(0,Math.min(100,score)),info=scoreInfo(score);
  return '<svg viewBox="0 0 100 100" width="112" height="112" style="flex:none" role="img" aria-label="Índice de rendimiento"><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="10"/>'+
    '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+info.c+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(c*v/100)+' '+c+'" transform="rotate(-90 50 50)"/>'+
    '<text class="ringv" x="50" y="57" text-anchor="middle" style="font-size:26px;font-weight:800;fill:var(--text)">'+(score==null?'—':Math.round(score))+'</text></svg>';
}
function metricRow(icon,label,val,p,color){
  return '<div class="metric"><div class="row between"><span>'+icon+' '+label+'</span><b>'+val+'</b></div><div class="bar"><i style="width:'+(p==null?0:Math.min(100,p))+'%;background:'+(color||'var(--primary)')+'"></i></div></div>';
}
function pc(a,b){return b?a/b*100:null}
function colorFor(p){return p==null?'var(--line)':p>=80?'var(--ok)':p>=60?'var(--warn)':'var(--bad)'}
function progressCore(){

  out+='<div class="card"><div class="score">'+ring(m.score)+'<div><div class="muted">Índice de rendimiento</div><div style="font-size:20px;font-weight:800;color:'+info.c+'">'+info.t+'</div>'+
    '<div class="muted" style="margin-top:4px">Combina estudio, tareas a tiempo, lecturas y notas.</div></div></div>';
  var pS=pc(m.mins,m.goalMin),pT=pc(m.tOn,m.tTotal),pR=pc(m.rDone,m.rSched),pG=m.avg==null?null:m.avg/S.settings.goal*100;
  out+=metricRow('⏱️','Tiempo de estudio',m.mins+' / '+m.goalMin+' min',pS,colorFor(pS));
  out+=metricRow('✅','Tareas entregadas a tiempo',m.tTotal?m.tOn+' / '+m.tTotal:'—',pT,colorFor(pT));
  out+=metricRow('📖','Lecturas cumplidas',m.rSched?m.rDone+' / '+m.rSched:'—',pR,colorFor(pR));
  out+=metricRow('📈','Promedio vs meta',fmtScore(m.avg)+' / '+fmtScore(S.settings.goal),pG,colorFor(pG));
  out+='</div><div class="card"><h2>Minutos de estudio por día</h2>'+barChart(n)+'</div><div class="card"><h2>Por materia</h2>';
  S.subjects.forEach(function(s){
    var a=subjAvg(s.id),st=subjStatus(s),mins=minsIn(n,s.id);
    var pend=S.tasks.filter(function(t){return t.subject===s.id&&!t.done}).length;

      '<div class="muted">'+mins+' min · '+pend+' '+plural(pend,'pendiente','pendientes')+(late?' · <span style="color:var(--bad)">'+late+' '+plural(late,'vencida','vencidas')+'</span>':'')+'</div></div>'+
      '<div style="text-align:right"><div><b>'+fmtScore(a)+'</b> '+trendHtml(trend(s.id))+'</div><span class="badge '+st+'">'+{late:'Reforzar',soon:'Atención',good:'Bien','':'Sin notas'}[st]+'</span></div></div>';
  });
  out+='</div><div class="card"><h2>'+ic('bulb')+'Recomendaciones'+(par?' para apoyarle':'')+'</h2>'+coach(n).map(function(t){return '<div class="tip">'+tipIc(t.i)+'<div class="grow">'+t.t+'</div></div>'}).join('')+'</div>';
  return out;

var timer={running:false,mode:'focus',left:0,iv:null,subject:'',total:0};
function resetTimer(){timer.total=timer.left=(timer.mode==='focus'?S.settings.pomo:S.settings.brk)*60}
resetTimer();
function mmss(s){var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function vStudy(){
  var set=studyDays(),dots='',d=today();
  for(var i=6;i>=0;i--){var x=new Date(d);x.setDate(d.getDate()-i);dots+='<span class="'+(set[ymd(x)]?'on':'')+'">'+DOWS()[x.getDay()]+'</span>'}
  var opts='<option value="">Sin materia</option>'+S.subjects.map(function(s){return '<option value="'+s.id+'"'+(timer.subject===s.id?' selected':'')+'>'+esc(s.name)+'</option>'}).join('');
  var st=streak();
  return '<div class="card"><div class="muted" style="text-align:center">'+(timer.mode==='focus'?'🎯 Enfoque':'☕ Descanso')+'</div>'+
   '<div class="timer" id="tm">'+mmss(timer.left)+'</div><label for="tsub">Materia</label><select id="tsub">'+opts+'</select>'+
   '<div class="row" style="margin-top:14px"><button class="btn" id="tgo" style="flex:1">'+(timer.running?'Pausar':'Iniciar')+'</button><button class="btn ghost" id="trs">Terminar</button></div>'+
   '<p class="muted" style="text-align:center;margin:10px 0 0">'+S.settings.pomo+' min de enfoque + '+S.settings.brk+' min de descanso. Cámbialo en ⚙️.</p></div>'+
   goalCard()+
   '<div class="grid2"><div class="card"><div class="muted">Hoy</div><div class="big">'+minsIn(1)+'</div><div class="muted">minutos</div></div>'+
   '<div class="card"><div class="muted">🔥 Racha</div><div class="big">'+st+'</div><div class="muted">'+plural(st,'día','días')+'</div></div></div>'+
   '<div class="card"><h2>Últimos 7 días</h2><div class="streak">'+dots+'</div><button class="btn ghost block" style="margin-top:14px" data-act="manual">+ Registrar estudio sin temporizador</button></div>';
}
function bindTimer(){
  $('#tsub').onchange=function(){timer.subject=this.value};
  $('#tgo').onclick=function(){if(timer.running)stopTimer();else startTimer();$('#tgo').textContent=T(timer.running?'Pausar':'Iniciar')};
  $('#trs').onclick=function(){
    var elapsed=Math.floor((timer.total-timer.left)/60),sub=timer.subject,wasFocus=timer.mode==='focus';
    stopTimer();timer.mode='focus';resetTimer();render();
    if(wasFocus&&elapsed>=5)ask('¿Guardar los '+elapsed+' min que llevas estudiados?','Guardar',function(){logStudy(elapsed,sub);render();toast('Sesión guardada ✅')},false);
  };
}
function startTimer(){
  timer.running=true;var end=Date.now()+timer.left*1000;
  timer.iv=setInterval(function(){
    timer.left=Math.max(0,Math.round((end-Date.now())/1000));
    var el=$('#tm');if(el)el.textContent=mmss(timer.left);
    if(timer.left<=0){
      stopTimer();
      if(timer.mode==='focus'){logStudy(Math.round(timer.total/60),timer.subject);notify('¡Sesión completada! 🎉 Toma un descanso de '+S.settings.brk+' min.');timer.mode='break'}
      else{notify('Descanso terminado. Hora de volver a enfocarte.');timer.mode='focus'}
      resetTimer();if(MODE==='student')softRender();
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    }
  },500);
}
function stopTimer(){timer.running=false;clearInterval(timer.iv)}

function tSend(text){
  text=(text||'').trim();if(!text||tutor.busy||!SAMPLER)return;
  if(!useAI('tutor'))return;
  tutor.msgs.push({role:'user',content:text});tutor.msgs.push({role:'assistant',content:''});
  S.tutorLog.push({d:ymd(new Date()),s:tutor.subject||'',q:text.slice(0,140)});

  tutor.busy=true;tutor.err='';tutor.ctl=ctl;
  var ta=$('#tq');if(ta)ta.value='';
  render();scrollChat();
  var hist=tutor.msgs.slice(0,-1).filter(function(m){return m.content}).slice(-12);
  while(hist.length&&hist[0].role!=='user')hist.shift();
  var turns=[{role:'user',content:tutorRules()}].concat(hist);
  SAMPLER(turns,{kind:'tutor',cache:false,signal:ctl.signal,onText:function(u){
    if(tutor.msgs[idx])tutor.msgs[idx].content=u.text;
    var b=$('#b'+idx);if(b)b.innerHTML=md(u.text);scrollChat();
  }}).then(function(r){
    tutor.msgs[idx].content=r.text;if(r.truncated)tutor.err='La respuesta se cortó. Escribe “continúa” para seguir.';
  },function(e){
    var code=e&&e.code;
    if(e&&e.text&&code!=='refused')tutor.msgs[idx].content=e.text;else{tutor.msgs.splice(idx,1);if(code!=='limit_reached'){var uu=usage();if(uu.t>0){uu.t--;save()}}}
    if(code!=='cancelled')tutor.err=errMsg(code);
  }).then(function(){tutor.busy=false;tutor.ctl=null;softRender();scrollChat()});
}

function startQuiz(id){
  var t=topicById(id);if(!t)return;

  if(!useAI('quiz'))return;
  var s=subj(t.subject);
  quiz={id:id,loading:true,items:null,ans:{},graded:false,err:''};drawQuiz();
  SAMPLER.json('Crea un mini examen de 5 preguntas de opción múltiple para un estudiante'+(S.settings.grade?' de '+S.settings.grade:'')+' sobre el tema «'+t.title+'»'+(s?' de la materia '+s.name:'')+'. '+
    'Usa un nivel acorde a su grado, en español sencillo, con preguntas variadas (concepto, ejemplo y aplicación). Cada pregunta tiene 4 opciones y solo una correcta.\n'+
    'Responde SOLO con un arreglo JSON como [{"pregunta":"...","opciones":["...","...","...","..."],"correcta":0,"explicacion":"una frase que explique la respuesta"}], donde "correcta" es el índice desde 0.',{cache:false,kind:'quiz'})
  .then(function(arr){
    if(!quiz||quiz.id!==id)return;
    if(!Array.isArray(arr))throw {code:'invalid_json'};
    quiz.items=arr.filter(function(q){return q&&q.pregunta&&Array.isArray(q.opciones)&&q.opciones.length>=2&&+q.correcta>=0&&+q.correcta<q.opciones.length})
      .slice(0,5).map(function(q){return {q:String(q.pregunta),o:q.opciones.slice(0,5).map(String),c:+q.correcta,e:String(q.explicacion||'')}});
    if(!quiz.items.length)throw {code:'invalid_json'};
  }).catch(function(e){if(quiz&&quiz.id===id)quiz.err=e&&e.code==='invalid_json'?'No se pudo armar el examen. Intenta otra vez.':errMsg(e&&e.code)})
  .then(function(){if(quiz&&quiz.id===id){quiz.loading=false;drawQuiz(true)}});
}
function drawQuiz(fromAsync){
  if(!quiz)return;
  if(fromAsync&&!$('#quizbox'))return;
  var sh=$('#sheet'),top=sh.scrollTop,t=topicById(quiz.id)||{title:''};
  var out='<div id="quizbox"><h3>'+ic('edit')+'Mini examen</h3><p class="muted" style="margin:0">'+esc(t.title)+'</p>';
  if(quiz.loading)out+='<div class="empty">Preparando 5 preguntas… puede tardar unos segundos.</div>';
  if(quiz.err)out+='<p style="color:var(--bad);font-size:14px">'+esc(quiz.err)+'</p>';
  var score=0;
  (quiz.items||[]).forEach(function(q,i){
    out+='<div class="qbox"><div class="title">'+(i+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(op,j){
      var cls='qopt';
      if(quiz.graded){if(j===q.c)cls+=' right';else if(quiz.ans[i]===j)cls+=' wrong'}else if(quiz.ans[i]===j)cls+=' sel';
      out+='<button class="'+cls+'" data-act="qa" data-id="'+i+':'+j+'">'+esc(op)+'</button>';
    });
    if(quiz.graded){if(quiz.ans[i]===q.c)score++;out+='<p class="muted" style="margin:8px 0 0">'+(quiz.ans[i]===q.c?'✅ ':'❌ ')+esc(q.e)+'</p>'}
    out+='</div>';
  });
  var n=(quiz.items||[]).length,answered=Object.keys(quiz.ans).length;
  if(quiz.graded)out+='<div class="card" style="margin:12px 0 0;background:var(--primary-soft);box-shadow:none"><b>Resultado: '+score+' de '+n+'</b><br>'+(score>=Math.ceil(n*0.8)?'¡Excelente! Marcamos este tema como dominado 😀':score/n<0.6?'Este tema necesita repaso. Pídele al tutor que te lo explique 😟':'¡Vas bien! Un repaso más y lo dominas 😐')+'</div>';
  out+='<div class="row wrap" style="margin-top:14px"><button class="btn ghost" data-act="close">Cerrar</button>'+
    (quiz.graded?'<button class="btn ghost" data-act="t-ex" style="margin-left:auto">'+ic('sparkle')+'Explícamelo</button><button class="btn" data-act="q-again">Otro examen</button>':
     n?'<button class="btn" data-act="q-grade" style="margin-left:auto"'+(answered<n?' disabled':'')+'>Calificar ('+answered+'/'+n+')</button>':(quiz.err?'<button class="btn" data-act="q-again" style="margin-left:auto">Intentar otra vez</button>':''))+'</div></div>';
  openModal(out);$('#sheet').scrollTop=top;
}
function gradeQuiz(){
  if(!quiz||!quiz.items||quiz.graded)return;
  var n=quiz.items.length,s=0;quiz.items.forEach(function(q,i){if(quiz.ans[i]===q.c)s++});

  var t=topicById(quiz.id);
  if(t){t.quiz={s:s,t:n,d:ymd(new Date())};t.conf=s>=Math.ceil(n*0.8)?3:s/n<0.6?1:2;
    S.tutorLog.push({d:ymd(new Date()),s:t.subject,q:'Mini examen: '+t.title+' ('+s+'/'+n+')'});if(S.tutorLog.length>80)S.tutorLog=S.tutorLog.slice(-80);save();render()}

}

function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){
      try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.subjects)||!Array.isArray(d.tasks))throw 0;
        ask('Esto reemplazará tus datos con los del archivo.','Restaurar',function(){var nm=S.settings.name;S=normalize(d);if(!S.settings.name)S.settings.name=nm;save();render();toast('Datos restaurados ✅')})}
      catch(e){toast('El archivo no es un respaldo válido.')}
    };r.readAsText(f);
  };inp.click();
}

  if(JSON.stringify(S.schoolTri||null)!==JSON.stringify(stri)){S.schoolTri=stri;changed=true}

  var evById={};evs.forEach(function(e){evById[e.id]=e});
  S.tasks.forEach(function(t){if(!t.schoolEv||!evById[t.schoolEv])return;var tid=evById[t.schoolEv].topicId,tp=tid?S.topics.filter(function(x){return x.schoolEv===tid})[0]:null,nt=tp?tp.id:'';
    if((t.topic||'')!==nt&&!(t.done&&!nt)){if(nt)t.topic=nt;else delete t.topic;changed=true}});

  return false;

   Nunca tareas de la casa, mensajes ni premios de la familia. */
function computePerf(T){
  var l=T&&T.settings&&T.settings.school;if(!l||l.status!=='approved')return null;
  var today=ymd(new Date()),wk=shift(today,-7),subs={},tot={tasks:0,done:0,onTime:0,late:0,pend:0,min7:0,weak:0},avgs=[];
  (T.subjects||[]).filter(function(x){return x.schoolSubj}).forEach(function(x){
    var ts=(T.tasks||[]).filter(function(t){return t.school&&t.subject===x.id}),gs=(T.grades||[]).filter(function(g){return g.subject===x.id}),tp=(T.topics||[]).filter(function(t){return t.subject===x.id});
    var o={name:x.name,avg:null,n:gs.length,tasks:ts.length,done:0,onTime:0,late:0,pend:0,min7:0,weak:0,quiz:null};
    var gso=gs.filter(function(g){return g.official}),a=wavg(gso.length?gso:gs);if(a!=null){o.avg=Math.round(a*10)/10;avgs.push(a)}
    ts.forEach(function(t){if(t.done){o.done++;if(t.doneAt&&t.doneAt<=t.due)o.onTime++}else if(t.due<today)o.late++;else o.pend++});
    (T.sessions||[]).forEach(function(z){if(z.subject===x.id&&z.date>=wk)o.min7+=Math.round(+z.minutes||0)});
    var qz=tp.filter(function(t){return t.quiz&&t.quiz.t});o.weak=tp.filter(function(t){return t.conf===1}).length;
    if(qz.length)o.quiz=Math.round(qz.reduce(function(a2,t){return a2+t.quiz.s/t.quiz.t*100},0)/qz.length);
    subs[x.schoolSubj]=o;['tasks','done','onTime','late','pend','min7','weak'].forEach(function(k){tot[k]+=o[k]});
  });
  tot.avg=avgs.length?Math.round(avgs.reduce(function(a2,b2){return a2+b2},0)/avgs.length*10)/10:null;
  var dn=(T.tasks||[]).filter(function(t){return t.school&&t.done&&t.schoolEv}).map(function(t){return String(t.schoolEv).slice(0,60)}).slice(-300);
  return {gradeId:l.gradeId,name:String(T.settings.name||'').slice(0,60),updatedAt:Date.now(),subs:subs,tot:tot,dn:dn};
}

  list.forEach(function(t){var sj=t.subject||t.subjectId||'',k=sj+'|'+(t.tri||1)+'|'+(t.unitNo||1);
    if(!m[k]){m[k]={key:k,sj:sj,tri:t.tri||1,unitNo:t.unitNo||1,unitName:t.unitName||'',temas:[]};out.push(m[k])}

/* Texto del cuadro → trimestres, unidades y temas.
   «Trimestre 2» cambia de trimestre; «Unidad 3: Nombre» abre una unidad; las demás líneas son temas de esa unidad. */
function temarioParse(text,tri0,existing){
  var tri=tri0,unit=null,units=[],items=[],ord={},have={},maxNo=0,dup=0;
  (existing||[]).forEach(function(t){have[t.tri+'|'+t.unitNo+'|'+t.title.toLowerCase()]=1;var k=t.tri+'|'+t.unitNo;ord[k]=Math.max(ord[k]||0,t.ord+1);maxNo=Math.max(maxNo,t.unitNo)});
  String(text).split(/\n+/).forEach(function(l){
    l=String(l).trim();if(!l)return;
    var tt=triOf(l.replace(/[:.\-–—]+$/,''));if(tt&&l.length<40){tri=tt;unit=null;return}
    var uu=unitOf(l);if(uu){unit=units.filter(function(x){return x.tri===tri&&x.no===uu.n})[0]||null;if(!unit){unit={tri:tri,no:uu.n,name:uu.name,n:0};units.push(unit)}else if(!unit.name&&uu.name)unit.name=uu.name;maxNo=Math.max(maxNo,uu.n);return}
    var d='',m=/^\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}|\d{4}-\d{1,2}-\d{1,2})\s*[-–—:·|,;]?\s*(.*)$/.exec(l);
    if(m){d=cellDate(m[1]);if(d)l=m[2]}
    l=stripBullet(l);if(l.length<2)return;
    if(!unit){unit={tri:tri,no:++maxNo,name:'',n:0};units.push(unit)}
    var k=unit.tri+'|'+unit.no;if(have[k+'|'+l.toLowerCase()]){dup++;return}have[k+'|'+l.toLowerCase()]=1;
    ord[k]=ord[k]||0;unit.n++;
    items.push({title:l.slice(0,120),date:d,tri:unit.tri,unitNo:unit.no,unitName:unit.name,ord:ord[k]++});
  });
  return {items:items.slice(0,200),units:units.filter(function(u){return u.n}),dup:dup};
}

function applyOp(T,op){
  if(!T||!T.tasks||!op)return false;
  if(op.op==='add'){
    var nid='pt_'+op.id;if(T.tasks.some(function(x){return x.id===nid}))return false;
    var c=cleanTask(op.task);if(!c.title||!c.due)return false;
    T.tasks.push(Object.assign({id:nid,type:'Tarea',prio:'media',note:'',subject:'',done:false,by:'parent',byName:String(op.byName||'').slice(0,40)},c,{reminders:cleanRems(op.task&&op.task.reminders)}));
    return true;
  }
  if(op.op==='tlink')return applyTLink(T,op);
  var t=T.tasks.filter(function(x){return x.id===op.taskId})[0];if(!t)return false;
  if(op.op==='edit'){if(t.school)return false;var c2=cleanTask(op.task),ch=false;Object.keys(c2).forEach(function(k){if(t[k]!==c2[k]){t[k]=c2[k];ch=true}});if(ch)t.editedBy=String(op.byName||'').slice(0,40);return ch}
  if(op.op==='del'){if(t.school)return false;T.tasks=T.tasks.filter(function(x){return x.id!==t.id&&!(x.parent===t.id&&!x.done)});return true}
  if(op.op==='rem'){
    var old=t.reminders||[],fired={};old.forEach(function(r){if(r.by==='parent'&&r.fired)fired[r.at]=1});
    var next=old.filter(function(r){return r.by!=='parent'}).concat(cleanRems(op.reminders).map(function(r){if(fired[r.at])r.fired=true;return r}));
    if(JSON.stringify(next)===JSON.stringify(old))return false;t.reminders=next;return true;
  }
  return false;
}

/* Estudiante: recibe los cambios de la familia */
function applyFamOps(list){
  if(MODE!=='student')return [];
  var done=[],msgs=[];
  list.filter(function(o){return o.student===mySid}).sort(function(a,b){return (a.at||0)-(b.at||0)}).forEach(function(o){
    if(applyOp(S,o)){if(o.op==='add')msgs.push((o.byName||'Tu familia')+' agregó: '+((o.task&&o.task.title)||''));else if(o.op==='rem')msgs.push((o.byName||'Tu familia')+' te puso recordatorios 🔔');else if(o.op==='tlink')msgs.push((o.byName||'Tu docente')+' cargó temario y actividades 📚')}

}

function setTemCtx(g,sj){SC.tlv=g.name;SC.tsj=sj.name;SC.atri=SC.ttri||triCurStaff()}
function teacherLvUnit(g,sj,u){setTemCtx(g,sj);return unitsOf(lvTemas(g.name,sj.name)).filter(function(x){return x.tri===u.tri&&x.unitNo===u.unitNo})[0]||null}
function temCurCtx(){var t=String(SC.tsel||'').split('|'),g=schGrade(t[0]),sj=g&&(g.subjects||[]).filter(function(z){return z.id===t[1]})[0];return g&&sj?{g:g,sj:sj}:null}

/* ---------- Familia: pedir a la docente el temario y las actividades por un link ---------- */
function tlKey(sid){return 'sf.tl.'+curSid+'.'+sid}
function tlSaved(sid){try{var x=JSON.parse(lsGet(tlKey(sid))||'null');return x&&x.exp>Date.now()?x:null}catch(e){return null}}
var TLMODE='';
function tlAskModal(sid,mode){
  TLMODE=mode==='notas'?'notas':'';
  var s=subj(sid);if(!s)return;var sv=tlSaved(sid);
  if(sv){tlShowLink(s,sv.link,sv.teacher);return}
  openModal((TLMODE?'<h3>📨 Pedir notas a la docente</h3><p class="muted" style="margin:0">Se crea un link para la docente de <b>'+esc(s.name)+'</b>. Lo abre sin cuenta ni registro y pone las notas de exámenes, laboratorios, proyectos y otras evaluaciones, con el % de cada una. Las notas le llegan':'<h3>📨 Pedir temario, actividades y notas</h3><p class="muted" style="margin:0">Se crea un link para la docente de <b>'+esc(s.name)+'</b>. Lo abre sin cuenta, pega o sube el temario, pone las actividades y las notas. Todo le llega')+' a '+esc(firstName())+' en la app, con su nombre.</p>'+
    '<label for="tl1">Nombre de la docente</label><input id="tl1" maxlength="60" value="'+esc(s.teacher||'')+'" placeholder="Ej. Profa. Ruiz">'+
    '<div class="row" style="margin-top:16px"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn famb" id="tlok" style="margin-left:auto">Crear link</button></div>');
  $('#tlok').onclick=function(){
    var tn=$('#tl1').value.trim(),b=this;b.disabled=true;
    var done=function(tok){var l=appLink()+'?tt='+tok;try{lsSet(tlKey(sid),JSON.stringify({link:l,teacher:tn,exp:Date.now()+29*864e5,tok:tok}))}catch(e){}tlShowLink(s,l,tn)};
    if(SAMPLE){var tok='demotl'+uid()+uid();(demo.tlinks||(demo.tlinks={}))[tok]={student:curSid,subjectId:sid,subject:s.name,studentName:firstName(),teacherName:tn,askedBy:parentName(),topicsN:0,tasksN:0};done(tok);return}
    if(!F()||!F().temLink){toast('Esta función se usa con las cuentas de la familia.');b.disabled=false;return}
    F().temLink('create',{studentId:curSid,subjectId:sid,subject:s.name,teacherName:tn,askedBy:parentName()}).then(function(r){done(r.token)},function(e){b.disabled=false;toast(String(e&&e.code||'').indexOf('limit')>=0?'Hoy ya se crearon muchos links. Intenta mañana.':'No se pudo crear el link. Revisa tu conexión.')});
  };
}

var TLG=[];
function tlBind(onSend){
  TLA=[];TLG=[];
  var drawG=function(){$('#tlg').innerHTML=TLG.map(function(x,i){return '<div class="item"><span class="evi">'+evalEmoji(x.type)+'</span><div class="grow"><div class="title">'+esc(x.name)+'</div><div class="muted">'+esc(x.type)+' · '+esc(fmtDate(x.date))+' · '+(x.pct||0)+'%</div></div><span class="badge">'+x.score+'/'+x.max+'</span><button class="btn ghost small" data-tlgrm="'+i+'" aria-label="Quitar">✕</button></div>'}).join('');
    Array.prototype.forEach.call(document.querySelectorAll('[data-tlgrm]'),function(b){b.onclick=function(){TLG.splice(+b.dataset.tlgrm,1);drawG()}})};
  $('#tlgadd').onclick=function(){var n=$('#tlgn').value.trim(),d=$('#tlgd').value,sc=$('#tlgs').value,mx=+$('#tlgm').value||10,pc=$('#tlgp').value===''?0:+$('#tlgp').value;
    if(!n){toast('Escriba el nombre de la evaluación.');$('#tlgn').focus();return}if(!d){toast('Elija la fecha.');return}
    if(sc===''||!(+sc>=0&&+sc<=mx)){toast('La nota debe estar entre 0 y '+mx+'.');$('#tlgs').focus();return}if(!(pc>=0&&pc<=100)){toast('El % debe estar entre 0 y 100.');return}
    TLG.push({type:$('#tlgty').value,name:n.slice(0,80),date:d,score:+sc,max:mx,pct:pc,tri:+$('#tlgt').value||1});$('#tlgn').value='';$('#tlgs').value='';drawG();toast('Nota agregada a la lista ✅')};
  var plan=function(){return temarioParse($('#tlt').value,+$('#tltr').value||1,[])};
  var drawActs=function(){$('#tla').innerHTML=TLA.length?TLA.map(function(a,i){var e=(TL_TYPES.filter(function(x){return x[0]===a.type})[0]||['','📝'])[1];
      return '<div class="item"><span class="evi">'+e+'</span><div class="grow"><div class="title">'+esc(a.title)+'</div><div class="muted">'+esc(a.type)+' · '+esc(fmtDate(a.due))+(a.topicTitle?' · 📚 '+esc(a.topicTitle):'')+'</div></div><button class="btn ghost small" data-tlrm="'+i+'" aria-label="Quitar">✕</button></div>'}).join(''):'';
    Array.prototype.forEach.call(document.querySelectorAll('[data-tlrm]'),function(b){b.onclick=function(){TLA.splice(+b.dataset.tlrm,1);drawActs()}})};
  var prev=function(){var p=plan(),sel=$('#tlatp'),cur=sel.value;
    $('#tlp').innerHTML=p.items.length?'<b>'+p.units.length+' '+plural(p.units.length,'unidad','unidades')+' · '+p.items.length+' '+plural(p.items.length,'tema','temas')+'</b><ul>'+p.units.slice(0,12).map(function(u){return '<li>Trimestre '+u.tri+' · Unidad '+u.no+(u.name?': '+esc(u.name):'')+' — '+u.n+' '+plural(u.n,'tema','temas')+'</li>'}).join('')+'</ul>':'';
    sel.innerHTML='<option value="">Sin tema</option>'+p.items.map(function(t){return '<option'+(t.title===cur?' selected':'')+'>'+esc(t.title)+'</option>'}).join('')};
  ['#tlt','#tltr'].forEach(function(q){$(q).addEventListener('input',prev);$(q).addEventListener('change',prev)});
  $('#tlf').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var inp=this;$('#tlfs').textContent='Leyendo '+f.name+'…';
    readTemarioFile(f).then(function(ls){inp.value='';if(!ls.length){$('#tlfs').textContent='No encontré temas en '+f.name+'.';return}
      var ta=$('#tlt');ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+ls.join('\n');prev();$('#tlfs').textContent='✅ '+f.name+': revise la lista y borre lo que no sea tema.'},
    function(){inp.value='';$('#tlfs').textContent='No se pudo leer el archivo. Guárdelo como Word (.docx), Excel (.xlsx), PDF o copie y pegue el texto.'})};
  $('#tlaadd').onclick=function(){var ti=$('#tlati').value.trim(),d=$('#tlad').value;if(!ti){toast('Escriba el título de la actividad.');$('#tlati').focus();return}if(!d){toast('Elija la fecha de entrega.');return}
    TLA.push({type:$('#tlaty').value,title:ti.slice(0,120),due:d,topicTitle:$('#tlatp').value,note:$('#tlan').value.trim().slice(0,300)});
    $('#tlati').value='';$('#tlan').value='';drawActs();toast('Agregada a la lista ✅')};
  $('#tlsend').onclick=function(){
    var tn=$('#tln').value.trim(),p=plan().items;if(!tn){toast('Escriba su nombre.');$('#tln').focus();return}
    if($('#tlati').value.trim()&&$('#tlad').value){$('#tlaadd').click()}
    if($('#tlgn').value.trim()&&$('#tlgd').value&&$('#tlgs').value!==''){$('#tlgadd').click()}
    if(!p.length&&!TLA.length&&!TLG.length){toast('Agregue el temario, una actividad o una nota.');return}
    var b=this;b.disabled=true;onSend({teacherName:tn,topics:p,tasks:TLA.slice(),grades:TLG.slice()},b);
  };
}
function tlThanks(r,name){return '<div class="tch"><div class="evc good"><div class="evc-e">🙌</div><div><b>¡Gracias!</b><div class="muted">Se enviaron '+r.topics+' '+plural(r.topics,'tema','temas')+', '+r.tasks+' '+plural(r.tasks,'actividad','actividades')+' y '+(r.grades||0)+' '+plural(r.grades||0,'nota','notas')+'. Le aparecen a '+esc(name)+' en su app.</div></div></div><button class="btn ghost block" id="tlmore" style="margin-top:12px">Agregar más</button></div>'}

/* La app del estudiante aplica lo que envió la docente */
function applyTLink(T,op){
  var sj=String(op.subject||''),ch=false,by=String(op.byName||'Docente').slice(0,40);T.topics=T.topics||[];
  if(!(T.subjects||[]).some(function(s){return s.id===sj}))return false;
  (op.topics||[]).slice(0,200).forEach(function(x,i){
    var title=String(x&&x.title||'').trim().slice(0,120);if(!title)return;var tri=+x.tri||1,un=+x.unitNo||1;
    if(T.topics.some(function(t){return t.subject===sj&&(t.tri||0)===tri&&(t.unit||0)===un&&String(t.title).toLowerCase()===title.toLowerCase()}))return;
    var d=/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:'';
    T.topics.push({id:'tt_'+op.id+'_'+i,subject:sj,title:title,week:d?mondayOf(parseD(d)):'',date:d,tri:tri,unit:un,unitName:String(x.unitName||'').slice(0,100),ord:+x.ord||i,conf:0,byTeacher:by});ch=true;
  });
  (op.tasks||[]).slice(0,60).forEach(function(x,i){
    var nid='tk_'+op.id+'_'+i;if(T.tasks.some(function(t){return t.id===nid}))return;
    var title=String(x&&x.title||'').trim().slice(0,120),due=/^\d{4}-\d{2}-\d{2}$/.test(x.due||'')?x.due:'';if(!title||!due)return;
    var tp=x.topicTitle?T.topics.filter(function(t){return t.subject===sj&&String(t.title).toLowerCase()===String(x.topicTitle).toLowerCase()})[0]:null;
    var t={id:nid,title:title,subject:sj,type:String(x.type||'Tarea').slice(0,40),due:due,time:/^\d\d:\d\d$/.test(x.time||'')?x.time:'',note:String(x.note||'').slice(0,300),prio:x.type==='Examen'?'alta':'media',done:false,by:'teacher',byName:by};
    if(tp)t.topic=tp.id;T.tasks.push(t);ch=true;
  });
  T.grades=T.grades||[];
  (op.grades||[]).slice(0,60).forEach(function(x,i){var gid2='tg_'+op.id+'_'+i;if(T.grades.some(function(g){return g.id===gid2}))return;
    var nm=String(x&&x.name||'').trim().slice(0,80),mx=+x.max||10,sc=+x.score,dd=/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:'';if(!nm||!dd||!(sc>=0&&sc<=mx))return;
    T.grades.push({id:gid2,subject:sj,name:nm,score:sc,max:mx,weight:+x.pct||1,date:dd,official:true,type:String(x.type||'').slice(0,40),tri:+x.tri||1,by:by,comment:String(x.comment||'').slice(0,200),viaLink:true});ch=true});
  return ch;
}

var EVAL_TYPES=[['Examen','🧪'],['Laboratorio','🔬'],['Actividad','🎯'],['Proyecto','🧩'],['Tarea','📝'],['Exposición','🎤'],['Revisión de cuaderno','📓'],['Prueba corta','✏️'],['Participación','🙋'],['Otro','🗂️']];
function evalEmoji(t){return (EVAL_TYPES.filter(function(x){return x[0]===t})[0]||['','🗂️'])[1]}
function schEvals(gid){var s=SCH();return (s&&s.evals&&s.evals[gid])||[]}
function schChecks(){var s=SCH();return (s&&s.checks)||{}}
function gradeStudents(gid){var s=SCH();return s?s.members.filter(function(m){return m.gradeId===gid}).sort(function(a,b){return a.name<b.name?-1:1}):[]}
function hasScore(x){return !!x&&x.s!==''&&x.s!=null&&isFinite(+x.s)}
/* Promedio final ponderado por el % de cada evaluación (en %, 0-100). Si ninguna tiene %, promedio simple. */
function evalFinal(evs,uid){
  var w=0,t=0,n=0,sm=0;
  evs.forEach(function(e){var x=(e.scores||{})[uid];if(!hasScore(x)||!(+e.max>0))return;var p=+x.s/+e.max*100;n++;sm+=p;if(+e.pct>0){w+=+e.pct;t+=p*+e.pct}});
  return w>0?t/w:(n?sm/n:null);
}
function evalAvg(e){var v=[];Object.keys(e.scores||{}).forEach(function(k){var x=e.scores[k];if(hasScore(x)&&+e.max>0)v.push(+x.s/+e.max*100)});return v.length?v.reduce(function(a,b){return a+b},0)/v.length:null}
function subjEvals(c){return schEvals(c.g.id).filter(function(e){return e.subjectId===c.sj.id}).sort(function(a,b){return (a.tri||1)-(b.tri||1)||(a.date<b.date?-1:a.date>b.date?1:0)})}
function classFinal(c){var evs=subjEvals(c),v=gradeStudents(c.g.id).map(function(m){return evalFinal(evs,m.id)}).filter(function(x){return x!=null});return v.length?v.reduce(function(a,b){return a+b},0)/v.length:null}

    var g=T.grades.filter(function(x){return x.id===id})[0];
    if(!g){T.grades.push(Object.assign({id:id},want));ch=true}

document.addEventListener('click',function(e){
  var c=e.target.closest('[data-c]');
  if(c&&c.parentNode.id==='colors'){pickedColor=c.dataset.c;var all=c.parentNode.children;for(var i=0;i<all.length;i++)all[i].classList.toggle('sel',all[i]===c);return}
  var el=e.target.closest('[data-act],[data-v]');if(!el)return;
  if(el.dataset.v){view=el.dataset.v;if(view==='premios')RVISIT++;render();window.scrollTo(0,0);return}
  var a=el.dataset.act,id=el.dataset.id;
  if(el.type==='checkbox')return;
  if(/^grp-/.test(a)){grpAction(a,id,el);return}
  if(/^(fr-|chore-)/.test(a)){casaAction(a,id);return}
  if(/^rev-/.test(a)){revAction(a,id);return}
  if(/^tv-/.test(a)){validAction(a,id,el);return}
  if(/^(sc-|cal-|subj-|stu-|pt-)/.test(a)){schoolAction(a,id,el);return}
  switch(a){
    case 'close':closeModal();break;
    case 'auth-tab':AUTH.tab=id;AUTH.err='';render();break;
    case 'auth-login':case 'auth-signup':case 'auth-google':case 'auth-reset':case 'ob-parent':case 'ob-join':case 'ob-join-parent':authAction(a);break;
    case 'logout':closeModal();SAMPLE=false;demo=null;F()&&F().signOut&&F().signOut();break;
    case 'fam-code':showFamilyCode();break;
    case 'copy-code':if(AUTH.fam&&AUTH.fam.code)copyText(AUTH.fam.code,'Código copiado ✅');break;
    case 'rem-perm':try{Notification.requestPermission().then(function(v){toast(v==='granted'?'Avisos activados ✓':'Tu navegador no permitió los avisos. Igual verás los recordatorios con la app abierta.');softRender()})}catch(e){toast('Este navegador no permite avisos.')}break;
    case 'lang':setLang(id);break;
    case 'settings':formSettings();break;
    case 'role-student':chooseStudent();break;
    case 'role-parent':enterParent();break;
    case 'be-st':becomeStudent(id);break;
    case 'pin':formPin(null);break;
    case 'demo':startDemo();break;
    case 'demo-exit':exitDemo();break;
    case 'demo-switch':MODE=MODE==='student'?'parent':'student';view=MODE==='parent'?'p_home':'home';render();window.scrollTo(0,0);break;
    case 'new-subject':formSubject();break;
    case 'assign-task':parentTaskForm();break;
    case 'assigned-edit':formAssignedTask(id);break;
    case 'assigned-del':deleteAssignedTask(id);break;
    case 'activity-type-add':formActivityType();break;
    case 'activity-type-edit':formActivityType(id);break;
    case 'activity-type-delete':deleteActivityType(id);break;
    case 'enable-reminders':if(!('Notification' in window)){toast('Este navegador no admite notificaciones.');break}Notification.requestPermission().then(function(v){if(v==='granted'){toast('Recordatorios activados ✓');checkAssignedReminders()}else toast('Permite las notificaciones desde los ajustes del navegador')});break;
    case 'edit-subject':formSubject(id);break;
    case 'edit-task':formTask(id);break;
    case 'edit-grade':formGrade(id);break;
    case 'edit-read':formRead(id);break;
    case 'new-read':formRead();break;
    case 'manual':formManual();break;
    case 'calc':formCalc();break;
    case 'filter':tasksFilter=id;render();break;
    case 'gfilter':gradeSubj=id;render();break;
    case 'period':period=+id;render();break;
    case 'share':copyText(reportText(),'Resumen copiado. Pégalo en WhatsApp o en un correo.');break;
    case 'pick-st':pickStudent(id);render();break;
    case 'note':formNote(id);break;
    case 'cheer':formNote('felicitacion',T('¡Felicidades por tu logro: '+id+'!')+' 🏅');break;
    case 'new-reward':formReward();break;
    case 'ideas':genIdeas();break;
    case 'idea-send':
      var it=ideas.items&&ideas.items[+id];if(!it)break;
      var sj=S.subjects.filter(function(s){return it.materia&&s.name.toLowerCase()===it.materia.toLowerCase()})[0];
      dbAdd('notes',{student:sidOf(),kind:it.tipo==='libro'?'libro':'consejo',title:it.titulo,text:it.detalle,subject:sj?sj.id:'',at:Date.now(),read:false,done:false})
        .then(function(ok){if(ok){ideas.sent[+id]=1;softRender();toast('Enviado 💌')}});
      break;
    case 'n-read':dbUpd('notes',id,{read:true});break;
    case 'n-done':dbUpd('notes',id,{done:true,read:true}).then(function(ok){if(ok)toast('¡Bien hecho! ✅')});break;
    case 'n-del':ask('Se eliminará este mensaje.','Eliminar',function(){dbDel('notes',id)});break;
    case 'all-notes':
      openModal('<h3>'+ic('mail')+'Mensajes de tu familia</h3><div style="margin-top:10px">'+myNotes().map(function(n){return noteHtml(n,n.kind==='recordatorio'&&!n.done?'<button class="btn famb small" data-act="n-done" data-id="'+n.id+'">Ya lo hice ✓</button>':'')}).join('')+'</div><div class="row"><button class="btn ghost" data-act="close" style="margin-left:auto">Cerrar</button></div>');
      break;
    case 'deliver':
      var rw=REWARDS().filter(function(r){return r.id===id})[0];if(!rw)break;
      dbUpd('rewards',id,{delivered:true,deliveredAt:Date.now(),achievedAt:rw.achievedAt||Date.now()}).then(function(ok){
        if(!ok)return;
        dbAdd('notes',{student:rw.student,kind:'premio',title:'¡Ganaste tu premio: '+rw.title+'!',text:'Lo lograste con tu esfuerzo: '+(RKIND[rw.kind]?RKIND[rw.kind].d(rw):'')+'. ¡Felicidades!',subject:'',at:Date.now(),read:false,done:false});
        toast('Premio entregado 🎉');
      });
      break;
    case 'r-ach':dbUpd('rewards',id,{achievedAt:Date.now()});break;
    case 'r-del':ask('Se eliminará este premio.','Eliminar',function(){dbDel('rewards',id)});break;
    case 'tq':
      var q=QUICK[+id],ta=$('#tq');if(!q||!ta)break;
      var qt=quickText(q[1],ta.value);
      if(qt)tSend(qt);else{toast('Elige un tema arriba o escribe tu duda.');ta.focus()}
      break;
    case 't-send':var t2=$('#tq'),tv=t2?t2.value.trim():'',qm=QUICK.filter(function(x){return x[1].trim()===tv})[0];
      if(qm){var q2=quickText(qm[1],'');if(q2)tSend(q2);else toast('Elige un tema arriba o escribe tu duda.')}else tSend(tv);break;
    case 't-stop':if(tutor.ctl)tutor.ctl.abort();break;
    case 't-new':tutor.msgs=[];tutor.err='';render();break;
    case 'del-subject':ask('Se eliminará la materia con sus tareas, notas y lecturas.','Eliminar',function(){
        S.subjects=S.subjects.filter(function(x){return x.id!==id});S.tasks=S.tasks.filter(function(x){return x.subject!==id});
        S.grades=S.grades.filter(function(x){return x.subject!==id});S.reads=S.reads.filter(function(x){return x.subject!==id});S.topics=S.topics.filter(function(x){return x.subject!==id});
        S.sessions.forEach(function(x){if(x.subject===id)x.subject=''});if(gradeSubj===id)gradeSubj='all';save();render()});break;
    case 'del-task':
      if((S.tasks.filter(function(x){return x.id===id})[0]||{}).school){toast('Esta actividad la puso tu colegio; no se puede eliminar.');break}
      var kids=S.tasks.filter(function(x){return x.parent===id}).length;
      ask(kids?'Se eliminará este examen y sus '+kids+' sesiones de repaso.':'Se eliminará esta actividad.','Eliminar',function(){S.tasks=S.tasks.filter(function(x){return x.id!==id&&x.parent!==id});save();render()});break;
    case 'del-grade':ask('Se eliminará esta nota.','Eliminar',function(){S.grades=S.grades.filter(function(x){return x.id!==id});save();render()});break;
    case 'del-read':ask('Se eliminará este horario de lectura.','Eliminar',function(){S.reads=S.reads.filter(function(x){return x.id!==id});save();render()});break;
    case 'subtab':subTab=id;render();break;
    case 'wk':weekOff+=+id;render();break;
    case 'tsf':topicSubj=id;render();break;
    case 'temario':formTemario();break;
    case 'topic':formTopic(id);break;
    case 'conf':var tt=topicById(curTopic);if(tt){tt.conf=+id;save();formTopic(curTopic);render()}break;
    case 't-study':studyTopic(id,'ex');break;
    case 't-ex':studyTopic(curTopic,'ex');break;
    case 't-sum':studyTopic(curTopic,'sum');break;
    case 't-quiz':startQuiz(curTopic);break;
    case 'qa':if(quiz&&!quiz.graded){var pp=id.split(':');quiz.ans[+pp[0]]=+pp[1];drawQuiz()}break;
    case 'q-grade':gradeQuiz();break;
    case 'q-again':startQuiz(quiz&&quiz.id);break;
    case 'topic-help':var th=topicById(id);if(th){helpSubj=th.subject;helpTopic=th.id;view='p_help';render();window.scrollTo(0,0)}break;
    case 'hs':helpSubj=id;helpTopic='';render();break;
    case 'ht':helpTopic=helpTopic===id?'':id;render();break;
    case 'h-msg':var hm=topicById(helpTopic),hsj=subj(helpSubj);formNote('consejo',hm?T('Te ayudo con: ')+hm.title:T('Te ayudo con ')+(hsj?hsj.name:''),helpSubj,helpTopic);break;
    case 'h-book':formNote('libro','',helpSubj,helpTopic);break;
    case 'h-rem':var hr=topicById(helpTopic),hs2=subj(helpSubj);formNote('recordatorio',T('Repasar: ')+(hr?hr.title:(hs2?hs2.name:'')),helpSubj,helpTopic);break;
    case 'h-guide':genGuide(false);break;
    case 'h-guide2':genGuide(true);break;
    case 'h-copy':if(guide&&guide.text)copyText(guide.text,'Guía copiada ✅');break;
    case 'tem-ai':temDetect();break;
    case 'tem-manual':temRead();tem.items=[{title:'',w:1}];drawTem();break;
    case 'tem-add':temSync();tem.items.push({title:'',w:tem.items.length?tem.items[tem.items.length-1].w:1});drawTem();break;
    case 'tem-del':temSync();tem.items.splice(+id,1);drawTem();break;
    case 'tem-back':tem.items=null;drawTem();break;
    case 'tem-save':temSave();break;
    case 'del-topic':ask('Se eliminará este tema.','Eliminar',function(){S.topics=S.topics.filter(function(x){return x.id!==id});save();render()});break;
    case 'plans':openPlans();break;
    case 'go-pro':closeModal();openPay();break;
    case 'pay-open':case 'pay-done':case 'pay-send':case 'adm-open':case 'adm-tab':case 'adm-verify':case 'adm-find':case 'adm-days':case 'adm-act':case 'adm-dismiss':case 'adm-revoke':case 'adm-save':case 'adm-month':payAction(a,id,el);break;
    case 'v-check':verifyCheck();break;
    case 'v-cycle':verify.cycle=id;drawVerify();break;
    case 'v-activate':activatePro();break;
    case 'pro-cancel':ask('Volverás al plan Gratis. La IA tendrá los límites gratuitos.','Cancelar Pro',function(){setPlan({plan:'free',since:Date.now()}).then(function(ok){if(ok)toast('Ahora estás en el plan Gratis')})});break;
    case 'ask-pro':askPro();break;
    case 'req-ok':dbUpd('notes',id,{read:true});break;
    case 'peer-invite':openPeerInvite();break;
    case 'group-create':case 'group-join':case 'group-copy':case 'group-refresh':case 'group-clear':case 'group-cancel':case 'group-accept':case 'group-decline':case 'group-kick':case 'group-leave':case 'group-parent-approve':case 'group-parent-reject':case 'group-parent-revoke':groupAction(a,id);break;
    case 'peer-accept':DB.doc('studyPeers/'+id).update({status:'accepted',acceptedAt:Date.now()}).then(function(){toast('Compañero agregado ✓')},writeErr);break;
    case 'peer-reject':DB.doc('studyPeers/'+id).update({status:'rejected',rejectedAt:Date.now()}).then(function(){toast('Invitación rechazada')},writeErr);break;
    case 'export':exportData();break;
    case 'import':importData();break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.act==='chore-toggle'){toggleChore(el.dataset.id,el.checked);return}
  if(el.dataset&&el.dataset.act==='sc-ngrade'){SC.gsel=el.value;render();return}
  if(el.dataset&&el.dataset.act==='toggle'&&el.checked&&MODE==='student'){evidenceModal(el.dataset.id,el);return}
  if(el.id==='tsubj'){tutor.subject=el.value;tutor.topic='';render();return}
  if(el.id==='ttopic'){tutor.topic=el.value;return}
  if(!el.dataset||!el.dataset.act)return;
  var id=el.dataset.id;
  if(el.dataset.act==='assigned-toggle'){var at=assignedTasks.filter(function(x){return x.id===id})[0];if(at&&MODE==='student'){DB.doc('assignedTasks/'+id).update({done:el.checked,doneAt:el.checked?ymd(new Date()):null,updatedAt:Date.now()}).then(function(){toast(el.checked?'Actividad completada ✓':'Actividad reabierta')},writeErr)}}
  if(el.dataset.act==='toggle'){
    var t=S.tasks.filter(function(x){return x.id===id})[0];
    if(t){t.done=el.checked;t.doneAt=el.checked?ymd(new Date()):null;save();
      if(el.checked)toast(diffDays(t.due)>=0?'¡Bien hecho! Entregada a tiempo ✅':'Completada ✅');
      setTimeout(render,el.checked?250:0)}
  }
  if(el.dataset.act==='read-done'){
    var r=S.reads.filter(function(x){return x.id===id})[0],k=ymd(new Date());
    if(r){if(el.checked)r.done[k]=1;else delete r.done[k];save();render()}
  }
});
document.addEventListener('keydown',function(e){if(e.target&&e.target.id==='tq'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();tSend(e.target.value)}});
$('#fab').onclick=function(){fabClick()};

render();
initCloud();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
setTimeout(checkReminders,1500);setTimeout(checkTaskReminders,2500);setInterval(checkTaskReminders,30000);setTimeout(function(){checkFamilyNotes();checkChores()},3000);setInterval(function(){checkFamilyNotes();checkChores();if(MODE==='student'&&view==='home')softRender()},30000);
})();
</script>
