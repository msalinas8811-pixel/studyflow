<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyFlow</title>
<meta name="theme-color" content="#0e3a73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyFlow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: app de estudio; barra inferior en celular, barra lateral en pantallas anchas; tarjetas planas con borde fino */
:root{
  --bg:#eff3f8; --card:#ffffff; --text:#10284a; --muted:#5a6b83; --line:#dde5ef; --line2:#cad6e4;
  --primary:#0f6fc6; --on-primary:#ffffff; --primary-soft:#e2eefa; --grad:linear-gradient(90deg,#0f6fc6,#1fb5c9);
  --hdr:#0e3a73; --hdr2:#16a6c6; --on-hdr:#ffffff;
  --accent:#e59a00; --accent-soft:#fdf0cf;
  --ok:#15803d; --ok-soft:#dcf3e3; --warn:#c77700; --warn-soft:#fbf0d6; --warn-text:#8a5100; --bad:#d32f2f; --bad-soft:#fde3e3;
  --fam:#0e8c83; --on-fam:#ffffff; --fam-soft:#dcf3f0; --famhdr:#0d4f5c; --famhdr2:#1fb39b;
  --t-blue:#ffffff; --t-amber:#ffffff; --t-teal:#ffffff; --t-red:#ffffff; --t-green:#ffffff;
  --c-blue:#10284a; --c-amber:#b06f00; --c-teal:#0e8c83; --c-red:#d32f2f; --c-green:#15803d;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:20px; --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0a1424; --card:#122039; --text:#e6eef9; --muted:#9db0ca; --line:#22365a; --line2:#2f4670;
    --primary:#4fa3f0; --on-primary:#061224; --primary-soft:#14305a; --grad:linear-gradient(90deg,#3d8fe6,#2cc6d6);
    --hdr:#0b2f60; --hdr2:#0e7f9c; --on-hdr:#ffffff;
    --accent:#f5b83d; --accent-soft:#36290c;
    --ok:#4ade80; --ok-soft:#123020; --warn:#f5a524; --warn-soft:#352810; --warn-text:#fcd34d; --bad:#f87171; --bad-soft:#3d191c;
    --fam:#34d1c0; --on-fam:#04211e; --fam-soft:#0f302f; --famhdr:#0b3d47; --famhdr2:#108a78;
    --t-blue:#122039; --t-amber:#122039; --t-teal:#122039; --t-red:#122039; --t-green:#122039;
    --c-blue:#e6eef9; --c-amber:#f5b83d; --c-teal:#34d1c0; --c-red:#f87171; --c-green:#4ade80;
    color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0a1424; --card:#122039; --text:#e6eef9; --muted:#9db0ca; --line:#22365a; --line2:#2f4670;
  --primary:#4fa3f0; --on-primary:#061224; --primary-soft:#14305a; --grad:linear-gradient(90deg,#3d8fe6,#2cc6d6);
  --hdr:#0b2f60; --hdr2:#0e7f9c; --on-hdr:#ffffff;
  --accent:#f5b83d; --accent-soft:#36290c;
  --ok:#4ade80; --ok-soft:#123020; --warn:#f5a524; --warn-soft:#352810; --warn-text:#fcd34d; --bad:#f87171; --bad-soft:#3d191c;
  --fam:#34d1c0; --on-fam:#04211e; --fam-soft:#0f302f; --famhdr:#0b3d47; --famhdr2:#108a78;
  --t-blue:#122039; --t-amber:#122039; --t-teal:#122039; --t-red:#122039; --t-green:#122039;
  --c-blue:#e6eef9; --c-amber:#f5b83d; --c-teal:#34d1c0; --c-red:#f87171; --c-green:#4ade80;
  color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.hr{display:flex;align-items:center;gap:8px;flex:none}
.lang{display:flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:3px;flex:none}
.lang button{border:0;background:none;color:#fff;font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 9px;border-radius:99px;cursor:pointer}
.lang button.on{background:#fff;color:#1162a8}
body.parent .lang button.on{color:#0f6e72}
@media (max-width:480px){.chip .nm{display:none}.chip{padding:3px 8px 3px 3px}}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh;font-size:15px;line-height:1.4;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.i{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
header{position:relative;z-index:5;background:linear-gradient(115deg,var(--hdr) 0%,#1162a8 55%,var(--hdr2) 100%);color:var(--on-hdr);padding:18px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px max(16px,calc((100% - 720px)/2)) 16px;border-radius:24px}
body.parent header{background:linear-gradient(115deg,var(--famhdr) 0%,#0f6e72 55%,var(--famhdr2) 100%)}
.hl{display:flex;align-items:center;gap:14px;min-width:0}
.hlogo{width:52px;height:52px;border-radius:15px;background:#fff;display:grid;place-items:center;flex:none;color:var(--hdr)}
.hlogo .i{width:30px;height:30px;stroke-width:2;color:#1162a8}
body.parent .hlogo .i{color:#0f6e72}
header h1{color:#fff}
header h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.025em;line-height:1.15}
header small{display:block;color:var(--on-hdr)}
header{flex-wrap:wrap;row-gap:10px}
.hsub{flex-basis:100%;padding-left:66px;margin-top:-6px}
@media (max-width:480px){.hsub{padding-left:0;margin-top:0}.hlogo{width:44px;height:44px}}
header small .hn{display:block;font-size:15px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
header small .hd{display:block;opacity:.82}
header small .hd::first-letter{text-transform:uppercase}
header small::first-letter{text-transform:uppercase}
.chip{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);color:var(--on-hdr);border-radius:99px;padding:4px 10px 4px 4px;font-size:13px;font-weight:500;cursor:pointer;max-width:190px;flex:none}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip>.i{color:var(--on-hdr);opacity:.9}
.chip .av{background:#fff;color:#1162a8}
body.parent .chip .av,.chip .av.fam{background:#fff;color:#0f6e72}
.av .i{width:58%;height:58%}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:13px;flex:none}
.av.fam{background:var(--fam);color:var(--on-fam)}
main{max-width:720px;margin:0 auto;padding:0 16px 24px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance;display:flex;align-items:center;gap:8px}
.card h2 .i{color:var(--primary);background:var(--primary-soft);width:30px;height:30px;padding:6px;border-radius:9px}
.card.fam{background:var(--fam-soft);border-color:transparent;box-shadow:none}
.card.fam h2,.card.fam h2 .i{color:var(--fam)}
.card.fam h2 .i{background:var(--card)}
.stat{position:relative}
.stat .si{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.s-amber .si{background:var(--accent-soft);color:var(--c-amber)}.s-teal .si{background:var(--fam-soft);color:var(--c-teal)}.s-red .si{background:var(--bad-soft);color:var(--c-red)}.s-green .si{background:var(--ok-soft);color:var(--c-green)}
.stat .si .i{width:20px;height:20px}
.stat>.muted:first-of-type{padding-right:40px;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;font-weight:500;color:var(--muted);opacity:1}
.stat .muted{color:var(--muted);opacity:1}
.s-blue{background:var(--t-blue);color:var(--c-blue)}.s-amber{background:var(--t-amber);color:var(--c-amber)}.s-teal{background:var(--t-teal);color:var(--c-teal)}.s-red{background:var(--t-red);color:var(--c-red)}.s-green{background:var(--t-green);color:var(--c-green)}
.stat .big{color:inherit}
.s-blue .big{color:var(--text)}

.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid2>.card{margin-bottom:0}
.muted{color:var(--muted);font-size:13px}
.big{font-size:32px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--primary);color:var(--on-primary);padding:11px 16px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;line-height:1.2}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.famb{background:var(--fam);color:var(--on-fam)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:8px;gap:5px}
.btn.block{width:100%}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:10}
nav .brand{display:none}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);padding:8px 0 7px;font-size:10px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button .i{width:56px;height:30px;padding:4px 0;border-radius:99px;stroke-width:1.8;transition:background .15s}
nav button.active{color:var(--primary);font-weight:600}
nav button.active .i{background:var(--primary);color:var(--on-primary)}
nav.parent button.active{color:var(--fam)}
nav.parent button.active .i{background:var(--fam);color:var(--on-fam)}
@media (min-width:900px){
  body{padding-bottom:24px;padding-left:232px}
  nav{top:0;bottom:0;right:auto;width:232px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:18px 12px;gap:2px}
  nav .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:-.02em;padding:4px 10px 18px;color:var(--text)}
  nav .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
  nav.parent .brand .logo{background:var(--fam);color:var(--on-fam)}
  nav .brand small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}
  nav button{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:14px;border-radius:10px;justify-content:flex-start}
  nav button .i,nav button.active .i{width:22px;height:22px;padding:0;background:none}
  nav button:hover{background:var(--bg);color:var(--text)}
  nav button.active{background:var(--primary);color:var(--on-primary)}
  nav.parent button.active{background:var(--fam);color:var(--on-fam)}
  header{margin-top:20px}
  .fab{bottom:28px!important}
}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.title{font-weight:600;overflow-wrap:anywhere}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-weight:600;white-space:nowrap}
.badge.late{background:var(--bad-soft);color:var(--bad)}
.badge.soon{background:var(--warn-soft);color:var(--warn-text)}
.badge.good{background:var(--ok-soft);color:var(--ok)}
.badge.fam{background:var(--fam-soft);color:var(--fam)}
.chk{width:22px;height:22px;accent-color:var(--primary);flex:none}
.done .title{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px;line-height:1.45}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar{height:10px;background:var(--bg);border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px}
.group{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:14px 0 2px}
.group:first-child{padding-top:0}
.group.late{color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 4px}
.sheet h4{margin:20px 0 4px;font-size:14px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.colors span{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.colors span.sel{border-color:var(--text)}
.timer{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.streak{display:flex;gap:6px;justify-content:center;margin-top:8px}
.streak span{width:30px;height:30px;border-radius:9px;background:var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.streak span.on{background:var(--accent);color:#1d1600}
svg text{fill:var(--muted);font-size:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 13px;border-radius:99px;font-size:13px;white-space:nowrap;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.tabs button.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);font-size:28px;box-shadow:0 6px 18px rgba(20,33,61,.28);cursor:pointer;z-index:9}
.score{display:flex;gap:16px;align-items:center}
.metric{margin:10px 0}
.metric .row{font-size:14px;margin-bottom:5px}
.tip{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.tip:last-child{border-bottom:0}
.tip .ti{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-size:14px;font-weight:600}
.tip .ti.bad{background:var(--bad-soft);color:var(--bad)}.tip .ti.warn{background:var(--warn-soft);color:var(--warn-text)}.tip .ti.good{background:var(--ok-soft);color:var(--ok)}.tip .ti.acc{background:var(--accent-soft);color:var(--accent)}
.trend{font-size:12px;font-weight:700}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)} .trend.eq{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sample{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn-text);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.sample b{color:var(--text)}
.role{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px;cursor:pointer;color:var(--text);font:inherit;margin-bottom:12px;line-height:1.4}
.role:hover{border-color:var(--primary)}
.role .e{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.role .e .i{width:28px;height:28px}
.role .e.fam{background:var(--fam-soft);color:var(--fam)}
.note{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--card);margin-bottom:8px;line-height:1.4}
.card .note{background:var(--bg)}
.note .e{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.note .e.k-felicitacion,.note .e.k-pro{background:var(--accent-soft);color:var(--accent)}.note .e.k-recordatorio{background:var(--warn-soft);color:var(--warn-text)}.note .e.k-premio,.note .e.k-solicitud{background:var(--fam-soft);color:var(--fam)}.note .e.k-libro{background:var(--ok-soft);color:var(--ok)}
.note .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bdg{text-align:center;padding:12px 6px;border-radius:12px;background:var(--bg);font-size:12px;line-height:1.3;border:0;color:var(--text);font-family:inherit}
.bdg .e{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:var(--accent-soft);color:var(--accent)}
.bdg .e .i{width:22px;height:22px}
.bdg.off{opacity:.45;filter:grayscale(1)}
button.bdg{cursor:pointer}
.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:90%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--primary-soft);color:var(--text);border-bottom-left-radius:4px}
.bub code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chipb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.chipb .i{color:var(--primary)}.chipb.on .i{color:inherit}
.chipb.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.who{font-size:20px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.qopt{display:block;width:100%;text-align:left;margin-top:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;line-height:1.35}
.qopt.sel{border-color:var(--primary);background:var(--primary-soft)}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qbox{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.trow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.trow select{width:auto;flex:none;padding:10px 6px}
.face{font-size:18px;flex:none;width:30px;text-align:center}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

function parseD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function shift(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}

/* ---------- Estudio y racha ---------- */
function studyDays(){
  var set={};
  S.sessions.forEach(function(s){set[s.date]=1});
  S.reads.forEach(function(r){Object.keys(r.done||{}).forEach(function(k){set[k]=1})});
  return set;
}
function streak(){var set=studyDays(),d=today(),n=0;if(!set[ymd(d)])d.setDate(d.getDate()-1);while(set[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function bestStreak(){
  var keys=Object.keys(studyDays()).sort(),best=0,run=0,prev=null;
  keys.forEach(function(k){run=(prev&&shift(prev,1)===k)?run+1:1;if(run>best)best=run;prev=k});
  return best;
}
function logStudy(minutes,subjectId,date){S.sessions.push({id:uid(),date:date||ymd(new Date()),minutes:minutes,subject:subjectId||''});save()}
function minsIn(n,subjectId){return sum(S.sessions.filter(function(s){return inPeriod(s.date,n)&&(subjectId==null||s.subject===subjectId)}).map(function(s){return +s.minutes||0}))}

/* ---------- Métricas ---------- */
function metrics(n){
  var m={n:n};
  m.mins=minsIn(n);m.goalMin=Math.round(S.settings.weekly*n/7);
  var ts=S.tasks.filter(function(t){return inPeriod(t.due,n)&&(t.done||diffDays(t.due)<0)});
  m.tTotal=ts.length;m.tOn=ts.filter(function(t){return t.done&&(!t.doneAt||t.doneAt<=t.due)}).length;
  m.rSched=0;m.rDone=0;
  for(var i=0;i<n;i++){
    var d=today();d.setDate(d.getDate()-i);
    var k=ymd(d),di=(d.getDay()+6)%7;
    S.reads.forEach(function(r){
      if(r.days.indexOf(di)<0)return;if(r.created&&r.created>k)return;
      var done=!!r.done[k];if(i===0&&!done)return;
      m.rSched++;if(done)m.rDone++;
    });
  }
  m.avg=overallAvg();
  var parts=[];
  if(m.goalMin>0)parts.push([Math.min(100,m.mins/m.goalMin*100),30]);
  if(m.tTotal)parts.push([m.tOn/m.tTotal*100,30]);
  if(m.rSched)parts.push([m.rDone/m.rSched*100,15]);
  if(m.avg!=null)parts.push([Math.min(100,m.avg/S.settings.goal*100),25]);
  var has=S.sessions.length||S.tasks.length||S.grades.length||S.reads.length;
  m.score=has?sum(parts.map(function(p){return p[0]*p[1]}))/sum(parts.map(function(p){return p[1]})):null;
  return m;
}
function scoreInfo(s){
  if(s==null)return {c:'var(--muted)',t:'Sin datos aún'};
  if(s>=80)return {c:'var(--ok)',t:'¡Excelente!'};
  if(s>=60)return {c:'var(--warn)',t:'Bien, puede mejorar'};
  return {c:'var(--bad)',t:'Necesita atención'};
}
function subjStatus(s){
  var a=subjAvg(s.id),tr=trend(s.id),goal=S.settings.goal;
  var late=S.tasks.filter(function(t){return t.subject===s.id&&!t.done&&diffDays(t.due)<0}).length;
  if((a!=null&&a<goal)||late)return 'late';
  if((a!=null&&a<goal+10)||(tr!=null&&tr<-5))return 'soon';
  return a==null?'':'good';
}
function trendHtml(tr){
  if(tr==null)return '';
  var v=r1(toScale(Math.abs(tr)));
  if(tr>3)return '<span class="trend up">▲ '+v+'</span>';
  if(tr<-3)return '<span class="trend down">▼ '+v+'</span>';
  return '<span class="trend eq">＝</span>';
}
function coach(n){
  var tips=[],m=metrics(n),pend=sortedPending(),goal=S.settings.goal,par=MODE==='parent';
  if(!S.subjects.length)return [{i:'👋',t:par?'Aún no ha registrado materias.':'Agrega tus materias para empezar a recibir recomendaciones.'}];
  if(!par&&famOn()){
    var rem=NOTES().filter(function(x){return x.student===sidOf()&&x.kind==='recordatorio'&&!x.done});
    if(rem.length)tips.push({i:'⏰',t:'Tu familia te recordó: <b>'+esc(rem[0].title)+'</b>.'});
  }
  var late=pend.filter(function(t){return diffDays(t.due)<0});
  if(late.length)tips.push({i:'🚨',t:(par?'Tiene ':'Tienes ')+late.length+' '+plural(late.length,'actividad vencida','actividades vencidas')+'. '+(par?'La más urgente: ':'Empieza por: ')+'<b>'+esc(late[0].title)+'</b>.'});
  pend.filter(function(t){var d=diffDays(t.due);return t.type==='Examen'&&d>=0&&d<=7}).forEach(function(t){
    var s=subj(t.subject),d=diffDays(t.due),plan=S.tasks.some(function(c){return c.parent===t.id});
    var ew=mondayOf(parseD(t.due)),tp=S.topics.filter(function(x){return x.subject===t.subject&&x.week<=ew&&x.conf!==3&&x.week>=shift(ew,-35)});
    tips.push({i:'📝',t:'Examen de <b>'+esc(s?s.name:t.title)+'</b> '+(d===0?'hoy':d===1?'mañana':'en '+d+' días')+'. '+
      (tp.length?(par?'Temas que aún no domina: ':'Temas que aún no dominas: ')+tp.slice(0,3).map(function(x){return '<b>'+esc(x.title)+'</b>'}).join(', ')+'. ':'')+
      (par?'Un repaso juntos de 20 minutos puede ayudar mucho.':plan?'Sigue tu plan de repaso.':'Repasa en varias sesiones cortas: rinde más que estudiar todo la noche anterior.')});
  });
  S.subjects.forEach(function(s){
    var a=subjAvg(s.id),tr=trend(s.id),mins=minsIn(n,s.id);
    if(a!=null&&a<goal)tips.push({i:'⚠️',t:'<b>'+esc(s.name)+'</b> está en '+fmtScore(a)+', bajo la meta de '+fmtScore(goal)+'. '+
      (par?(mins<60?'Solo le dedicó '+mins+' min en el período. Proponle sesiones cortas o pídele que use el tutor de IA.':'Considera hablar con el docente o buscar un recurso de apoyo.')
        :(mins<60?'Solo le dedicaste '+mins+' min: programa al menos 3 sesiones de '+S.settings.pomo+' min.':'Pregúntale al tutor de IA los temas que no entiendas.'))});
    else if(tr!=null&&tr<-5)tips.push({i:'📉',t:'<b>'+esc(s.name)+'</b> bajó '+r1(toScale(-tr))+' puntos en la última evaluación. '+(par?'Pregúntale qué se le hizo difícil.':'Revisa los errores para no repetirlos.')});
  });
  if(m.goalMin&&m.mins<m.goalMin*0.5)tips.push({i:'⏱️',t:(par?'Lleva ':'Llevas ')+m.mins+' de '+m.goalMin+' min de estudio en el período.'+(par?'':' Un bloque de '+S.settings.pomo+' min hoy ya suma.')});
  if(m.rSched>=3&&m.rDone/m.rSched<0.6)tips.push({i:'📖',t:'Cumplió el '+Math.round(m.rDone/m.rSched*100)+'% de las lecturas. Prueben sesiones más cortas o cambiar la hora.'});
  var noG=S.subjects.filter(function(s){return subjAvg(s.id)==null});
  if(noG.length&&!par)tips.push({i:'📈',t:'Registra notas de '+noG.map(function(s){return '<b>'+esc(s.name)+'</b>'}).join(', ')+' para medir el avance.'});
  var st=streak();
  if(st===0&&!par)tips.push({i:'🔥',t:'Empieza una racha hoy: una sola sesión de estudio cuenta.'});
  else if(st>=5)tips.push({i:'🏆',t:'¡'+st+' días seguidos estudiando!'+(par?' Es un buen momento para felicitarle.':' Mantén el ritmo.')});
  if(!tips.length)tips.push({i:'🌟',t:par?'Todo va bien y al día. ¡Un buen momento para felicitarle!':'¡Vas muy bien! Todo está al día. Aprovecha para adelantar o repasar.'});
  return tips;
}

var RKIND={
  streak:{l:'Racha de estudio (días seguidos)',d:function(r){return 'Racha de '+r.target+' días seguidos estudiando'}},
  minutes:{l:'Minutos de estudio en 7 días',d:function(r){return 'Estudiar '+r.target+' min en una semana'}},
  ontime:{l:'% de tareas a tiempo (30 días)',d:function(r){return 'Entregar a tiempo el '+r.target+'% de las tareas'}},
  avg:{l:'Promedio general',d:function(r){return 'Promedio general de '+r.target+' o más'}},
  subject:{l:'Nota de una materia',d:function(r){var s=subj(r.subject);return 'Llegar a '+r.target+' en '+(s?s.name:'la materia')}},
  manual:{l:'Otra meta (la marcas tú)',d:function(r){return r.cond||'Meta acordada en familia'}}
};
function rProgress(r){
  var cur=0,tg=+r.target||1;
  if(r.kind==='streak')cur=streak();
  else if(r.kind==='minutes')cur=minsIn(7);
  else if(r.kind==='ontime'){var m=metrics(30);cur=m.tTotal?Math.round(m.tOn/m.tTotal*100):0}
  else if(r.kind==='avg'){var a=overallAvg();cur=a==null?0:r1(toScale(a))}
  else if(r.kind==='subject'){var b=subjAvg(r.subject);cur=b==null?0:r1(toScale(b))}
  else {cur=r.achievedAt?1:0;tg=1}
  var ok=!!r.achievedAt||cur>=tg;
  return {cur:cur,tg:tg,p:Math.min(100,cur/tg*100),ok:ok};
}
var latched={};
function checkRewards(){
  if(MODE!=='student'||!famOn())return;

  });
}

function chart(gs){
  if(gs.length<2)return '<div class="empty">Se necesitan al menos 2 notas para ver la gráfica.</div>';
  var W=320,H=150,pl=28,pb=18,pt=8,pr=8,n=gs.length;
  var x=function(i){return pl+i*(W-pl-pr)/(n-1)};
  var y=function(p){return pt+(H-pt-pb)*(1-Math.max(0,Math.min(100,p))/100)};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfica de notas">';
  [0,50,100].forEach(function(v){svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="2" y="'+(y(v)+3)+'">'+r1(toScale(v))+'</text>'});
  var gy=y(S.settings.goal);
  svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ok)" stroke-dasharray="4 4"/>';
  svg+='<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" points="'+gs.map(function(g,i){return x(i)+','+y(pct(g))}).join(' ')+'"/>';
  gs.forEach(function(g,i){var s=subj(g.subject);svg+='<circle cx="'+x(i)+'" cy="'+y(pct(g))+'" r="4.5" fill="'+(s?s.color:'var(--primary)')+'" stroke="var(--card)" stroke-width="1.5"><title>'+esc(g.name)+': '+g.score+'/'+g.max+'</title></circle>'});
  return svg+'</svg><div class="muted">Línea verde punteada = meta</div>';
}
function barChart(n){
  var data=[];for(var i=n-1;i>=0;i--){var d=today();d.setDate(d.getDate()-i);var k=ymd(d);
    data.push({d:d,m:sum(S.sessions.filter(function(s){return s.date===k}).map(function(s){return +s.minutes||0}))})}
  var daily=S.settings.weekly/7,mx=Math.max(daily,10);data.forEach(function(x){mx=Math.max(mx,x.m)});
  var W=320,H=130,pl=6,pr=6,pt=8,pb=18,bw=(W-pl-pr)/n,gap=n>10?1.5:6;
  var y=function(v){return pt+(H-pt-pb)*(1-v/mx)};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Minutos de estudio por día">';
  data.forEach(function(x,i){
    var h=(H-pt-pb)*x.m/mx,X=pl+i*bw+gap/2;
    svg+='<rect x="'+X+'" y="'+(H-pb-h)+'" width="'+(bw-gap)+'" height="'+Math.max(h,x.m?2:0)+'" rx="'+(n>10?1.5:4)+'" fill="'+(x.m>=daily?'var(--ok)':'var(--primary)')+'"><title>'+x.d.toLocaleDateString(LOC,{day:'numeric',month:'short'})+': '+x.m+' min</title></rect>';
    var lab=n<=7?DOWS()[x.d.getDay()]:((n-1-i)%5===0?String(x.d.getDate()):'');
    if(lab)svg+='<text x="'+(X+(bw-gap)/2)+'" y="'+(H-4)+'" text-anchor="middle">'+lab+'</text>';
  });
  svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(daily)+'" y2="'+y(daily)+'" stroke="var(--ok)" stroke-dasharray="4 4"/>';
  return svg+'</svg><div class="muted">Verde = día con la meta diaria cumplida (~'+Math.round(daily)+' min, línea punteada)</div>';
}
function ring(score){
  var r=42,c=2*Math.PI*r,v=score==null?0:Math.max(0,Math.min(100,score)),info=scoreInfo(score);
  return '<svg viewBox="0 0 100 100" width="112" height="112" style="flex:none" role="img" aria-label="Índice de rendimiento"><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="10"/>'+
    '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+info.c+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(c*v/100)+' '+c+'" transform="rotate(-90 50 50)"/>'+
    '<text x="50" y="57" text-anchor="middle" style="font-size:26px;font-weight:800;fill:var(--text)">'+(score==null?'—':Math.round(score))+'</text></svg>';
}

   '<div class="grid2"><div class="card"><div class="muted">Hoy</div><div class="big">'+minsIn(1)+'</div><div class="muted">minutos</div></div>'+

}
function bindTimer(){
  $('#tsub').onchange=function(){timer.subject=this.value};
  $('#tgo').onclick=function(){if(timer.running)stopTimer();else startTimer();$('#tgo').textContent=T(timer.running?'Pausar':'Iniciar')};
  $('#trs').onclick=function(){
    var elapsed=Math.floor((timer.total-timer.left)/60),sub=timer.subject,wasFocus=timer.mode==='focus';
    stopTimer();timer.mode='focus';resetTimer();render();
    if(wasFocus&&elapsed>=5)ask('¿Guardar los '+elapsed+' min que llevas estudiados?','Guardar',function(){logStudy(elapsed,sub);render();toast('Sesión guardada ✅')},false);
  };
}
function startTimer(){
  timer.running=true;var end=Date.now()+timer.left*1000;
  timer.iv=setInterval(function(){
    timer.left=Math.max(0,Math.round((end-Date.now())/1000));
    var el=$('#tm');if(el)el.textContent=mmss(timer.left);
    if(timer.left<=0){
      stopTimer();
      if(timer.mode==='focus'){logStudy(Math.round(timer.total/60),timer.subject);notify('¡Sesión completada! 🎉 Toma un descanso de '+S.settings.brk+' min.');timer.mode='break'}
      else{notify('Descanso terminado. Hora de volver a enfocarte.');timer.mode='focus'}
      resetTimer();if(MODE==='student')softRender();
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    }
  },500);
}

var tutor={msgs:[],busy:false,ctl:null,subject:'',err:''};
var QUICK=[['🧒 Explícamelo fácil','Explícame de forma fácil: '],['🧩 Dame un ejemplo','Dame un ejemplo resuelto paso a paso, parecido a esto: '],
  ['📝 Practicar','Hazme 3 preguntas de práctica, de una en una, sobre: '],['✔️ Revisa mi respuesta','Revisa si mi respuesta está bien. El ejercicio y mi respuesta son: '],
  ['🗂️ Resumen','Hazme un resumen corto para estudiar sobre: ']];
function md(t){
  var h=esc(t);
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,6}\s*/gm,'').replace(/^\s*[-*]\s+/gm,'• ').replace(/`([^`\n]+)`/g,'<code>$1</code>');
  return h;
}
function tutorRules(){
  var s=subj(tutor.subject);
  return 'Eres un tutor paciente y amable para un estudiante'+(S.settings.grade?' de '+S.settings.grade:' escolar')+'. Hablas en español sencillo.'+
    (s?' La materia es '+s.name+'.':'')+tutorWeekCtx()+'\nReglas:\n'+
    '- Explica paso a paso, con palabras simples y ejemplos de la vida diaria.\n'+
    '- Si la pregunta parece una tarea o un examen, no des solo la respuesta final: guía con pistas y pasos y deja que el estudiante haga el último paso. Si ya intentó, revisa su intento y corrige con amabilidad.\n'+
    '- Respuestas cortas (unas 180 palabras como máximo) salvo que pida más.\n'+
    '- Termina con una pregunta corta para comprobar que entendió, o con un mini ejercicio.\n'+
    '- Usa **negritas** para lo clave y listas con "- " o "1. ". No uses tablas ni LaTeX; escribe fórmulas en texto simple (x^2, 3/4).\n'+
    '- Si no estás seguro de algo, dilo. Mantén un tono motivador y apropiado para su edad.\n'+
    'Cuando el estudiante escriba, ayúdale con su duda.';
}
function errMsg(code){
  return ({not_granted:'La IA no está permitida para esta app. Puedes activarla en los permisos del artefacto.',sampling_disabled:'La IA no está disponible para esta cuenta.',
    rate_limited:'Demasiadas preguntas seguidas. Espera un momento e intenta de nuevo.',session_expired:'Tu sesión de Claude expiró. Vuelve a iniciar sesión.',
    refused:'No puedo responder eso. Prueba preguntando de otra forma.',pro_required:'Esta función es parte del plan Pro.',empty_completion:'No llegó respuesta. Prueba con una pregunta más corta.'})[code]||'No se pudo conectar con la IA. Intenta de nuevo.';
}
function vTutor(){
  if(!SAMPLER)return '<div class="card"><h2>'+ic('sparkle')+'Tutor de IA</h2><div class="empty">'+(CLOUD==='pending'?'Conectando…':'El tutor funciona cuando abres StudyFlow dentro de Claude con tu sesión iniciada.')+'</div></div>';

  tutor.msgs.forEach(function(m,i){out+='<div class="bub '+(m.role==='user'?'me':'ai')+'" id="b'+i+'">'+(m.role==='user'?esc(m.content):(m.content?md(m.content):'Pensando…'))+'</div>'});
  out+='</div>'+(tutor.err?'<p style="color:var(--bad);font-size:14px;margin:0 0 10px">'+esc(tutor.err)+'</p>':'');
  out+='<div class="chips">'+QUICK.map(function(q,i){return '<button class="chipb" data-act="tq" data-id="'+i+'">'+ei(q[0].split(' ')[0])+q[0].replace(/^\S+\s/,'')+'</button>'}).join('')+'</div>';
  out+='<label for="tq" class="muted" style="margin-top:0">Tu duda</label><textarea id="tq" rows="3" placeholder="Escribe tu duda…"></textarea><div class="row" style="margin-top:10px">'+
    (tutor.msgs.length&&!tutor.busy?'<button class="btn ghost small" data-act="t-new">Nueva conversación</button>':'')+
    '<button class="btn" style="margin-left:auto" data-act="'+(tutor.busy?'t-stop':'t-send')+'">'+(tutor.busy?'Detener':'Enviar')+'</button></div></div>';
  return out;

function scrollChat(){var b=$('#msgs');if(b&&b.lastElementChild){var r=b.lastElementChild.getBoundingClientRect();if(r.bottom>window.innerHeight-90)window.scrollBy(0,r.bottom-window.innerHeight+110)}}
function tSend(text){
  text=(text||'').trim();if(!text||tutor.busy||!SAMPLER)return;
  if(!useAI('tutor'))return;
  tutor.msgs.push({role:'user',content:text});tutor.msgs.push({role:'assistant',content:''});
  S.tutorLog.push({d:ymd(new Date()),s:tutor.subject||'',q:text.slice(0,140)});
  if(S.tutorLog.length>80)S.tutorLog=S.tutorLog.slice(-80);
  save();
  var idx=tutor.msgs.length-1,ctl=new AbortController();
  tutor.busy=true;tutor.err='';tutor.ctl=ctl;
  var ta=$('#tq');if(ta)ta.value='';
  render();scrollChat();
  var hist=tutor.msgs.slice(0,-1).filter(function(m){return m.content}).slice(-12);
  while(hist.length&&hist[0].role!=='user')hist.shift();
  var turns=[{role:'user',content:tutorRules()}].concat(hist);
  SAMPLER(turns,{kind:'tutor',cache:false,signal:ctl.signal,onText:function(u){
    if(tutor.msgs[idx])tutor.msgs[idx].content=u.text;
    var b=$('#b'+idx);if(b)b.innerHTML=md(u.text);scrollChat();
  }}).then(function(r){
    tutor.msgs[idx].content=r.text;if(r.truncated)tutor.err='La respuesta se cortó. Escribe “continúa” para seguir.';
  },function(e){
    var code=e&&e.code;
    if(e&&e.text&&code!=='refused')tutor.msgs[idx].content=e.text;else tutor.msgs.splice(idx,1);
    if(code!=='cancelled')tutor.err=errMsg(code);
  }).then(function(){tutor.busy=false;tutor.ctl=null;softRender();scrollChat()});
}

function genIdeas(){

  var again=ideas.sid===curSid&&!!ideas.items,sid=curSid;
  ideas={sid:sid,loading:true,items:null,err:'',sent:{}};softRender();
  var opts={kind:'ideas'};if(again)opts.cache=false;
  SAMPLER.json(ideasPrompt(),opts).then(function(arr){
    if(!Array.isArray(arr))throw {code:'invalid_json'};
    if(ideas.sid!==sid)return;
    ideas.items=arr.filter(function(x){return x&&x.titulo}).slice(0,6).map(function(x){return {tipo:String(x.tipo||'consejo'),materia:String(x.materia||''),titulo:String(x.titulo).slice(0,80),detalle:String(x.detalle||'').slice(0,300)}});
  }).catch(function(e){if(ideas.sid===sid)ideas.err=e&&e.code==='invalid_json'?'No se pudieron leer las ideas. Intenta otra vez.':errMsg(e&&e.code)})

}

/* ---------- Temario por semana ---------- */
var weekOff=0,subTab='temario',topicSubj='all',curTopic='',tem=null,quiz=null;
var CONF=[['❔','Sin evaluar',''],['😟','Me cuesta','late'],['😐','Más o menos','soon'],['😀','Lo domino','good']];
function mondayOf(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)}
function weekLabel(w){var a=parseD(w),b=parseD(shift(w,6));return a.toLocaleDateString(LOC,{day:'numeric',month:'short'})+' – '+b.toLocaleDateString(LOC,{day:'numeric',month:'short'})}
function topicById(id){return S.topics.filter(function(t){return t.id===id})[0]}
function topicsOfWeek(w){return S.topics.filter(function(t){return t.week===w})}
function isWeak(t){return t.conf===1||(!!t.quiz&&t.quiz.s/t.quiz.t<0.6&&t.conf!==3)}
function weakTopics(){return S.topics.filter(isWeak)}
function tutorWeekCtx(){
  var w=mondayOf(new Date()),l=topicsOfWeek(w).filter(function(t){return !tutor.subject||t.subject===tutor.subject}).map(function(t){return t.title});
  var wk=weakTopics().filter(function(t){return !tutor.subject||t.subject===tutor.subject}).map(function(t){return t.title});
  return (l.length?' Esta semana en clase ve: '+l.join('; ')+'.':'')+(wk.length?' Temas que le cuestan: '+wk.slice(0,5).join('; ')+'.':'');
}
function topicRow(t,par){
  var s=subj(t.subject),c=CONF[t.conf||0];
  return '<div class="item"><span class="dot" style="background:'+(s?s.color:'#999')+'"></span>'+
    '<div class="grow" '+(par?'':'data-act="topic" data-id="'+t.id+'" style="cursor:pointer"')+'><div class="title">'+esc(t.title)+'</div>'+
    '<div class="muted">'+(s?esc(s.name):'')+(t.quiz?' · mini examen '+t.quiz.s+'/'+t.quiz.t:'')+'</div></div>'+
    '<span class="face" title="'+c[1]+'" aria-label="'+c[1]+'">'+c[0]+'</span>'+
    (par&&isWeak(t)?'<button class="btn famb small" data-act="topic-help" data-id="'+t.id+'">Apoyar</button>':'')+
    (par?'':'<button class="btn ghost small" data-act="t-study" data-id="'+t.id+'" aria-label="Estudiar con IA">🤖</button>')+'</div>';
}
function weekNav(w){
  var lab=weekOff===0?'Esta semana':weekOff===1?'Próxima semana':weekOff===-1?'Semana pasada':(weekOff>0?'En '+weekOff+' semanas':'Hace '+(-weekOff)+' semanas');
  return '<div class="row between" style="margin-bottom:6px"><button class="btn ghost small" data-act="wk" data-id="-1" aria-label="Semana anterior">‹</button>'+
    '<div style="text-align:center"><div class="title">'+lab+'</div><div class="muted">'+weekLabel(w)+'</div></div><button class="btn ghost small" data-act="wk" data-id="1" aria-label="Semana siguiente">›</button></div>';
}
function vTemario(){
  if(!S.subjects.length)return '<div class="card"><div class="empty">Primero agrega tus materias en «Materias y lecturas».</div></div>';
  var w=shift(mondayOf(new Date()),weekOff*7),list=topicsOfWeek(w);
  var out='<div class="card">'+weekNav(w);
  if(!list.length)out+='<div class="empty">No hay temas para esta semana.'+(S.topics.length?'':'<br>Carga el temario de tus materias con el botón <b>+</b>: pega el texto o sube una foto.')+'</div>';
  else S.subjects.forEach(function(s){list.filter(function(t){return t.subject===s.id}).forEach(function(t){out+=topicRow(t)})});
  out+='<p class="muted" style="margin:8px 0 0">Toca un tema para decir cómo te sientes y estudiarlo con IA. ❔ sin evaluar · 😟 me cuesta · 😐 más o menos · 😀 lo domino</p></div>';
  var wk=weakTopics();
  if(wk.length)out+='<div class="card"><h2>'+ic('alert')+'Temas por reforzar</h2>'+wk.slice(0,8).map(function(t){return topicRow(t)}).join('')+'</div>';
  if(S.topics.length){
    out+='<div class="card"><h2>Todo el temario</h2><div class="tabs"><button data-act="tsf" data-id="all" class="'+(topicSubj==='all'?'active':'')+'">Todas</button>'+
      S.subjects.map(function(s){var all=S.topics.filter(function(t){return t.subject===s.id});if(!all.length)return '';var dm=all.filter(function(t){return t.conf===3}).length;
        return '<button data-act="tsf" data-id="'+s.id+'" class="'+(topicSubj===s.id?'active':'')+'">'+esc(s.name)+' · '+dm+'/'+all.length+' 😀</button>'}).join('')+'</div>';
    var tl=S.topics.filter(function(t){return topicSubj==='all'||t.subject===topicSubj}).sort(function(a,b){return a.week<b.week?-1:a.week>b.week?1:0}),lw='';
    tl.forEach(function(t){if(t.week!==lw){lw=t.week;out+='<div class="group">Semana '+weekLabel(t.week)+'</div>'}out+=topicRow(t)});

    'Responde SOLO con un arreglo JSON como [{"pregunta":"...","opciones":["...","...","...","..."],"correcta":0,"explicacion":"una frase que explique la respuesta"}], donde "correcta" es el índice desde 0.',{cache:false,kind:'quiz'})
  .then(function(arr){

    quiz.items=arr.filter(function(q){return q&&q.pregunta&&Array.isArray(q.opciones)&&q.opciones.length>=2&&+q.correcta>=0&&+q.correcta<q.opciones.length})
      .slice(0,5).map(function(q){return {q:String(q.pregunta),o:q.opciones.slice(0,5).map(String),c:+q.correcta,e:String(q.explicacion||'')}});

function drawQuiz(fromAsync){
  if(!quiz)return;

  var sh=$('#sheet'),top=sh.scrollTop,t=topicById(quiz.id)||{title:''};
  var out='<div id="quizbox"><h3>'+ic('edit')+'Mini examen</h3><p class="muted" style="margin:0">'+esc(t.title)+'</p>';
  if(quiz.loading)out+='<div class="empty">Preparando 5 preguntas… puede tardar unos segundos.</div>';
  if(quiz.err)out+='<p style="color:var(--bad);font-size:14px">'+esc(quiz.err)+'</p>';
  var score=0;
  (quiz.items||[]).forEach(function(q,i){
    out+='<div class="qbox"><div class="title">'+(i+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(op,j){
      var cls='qopt';
      if(quiz.graded){if(j===q.c)cls+=' right';else if(quiz.ans[i]===j)cls+=' wrong'}else if(quiz.ans[i]===j)cls+=' sel';
      out+='<button class="'+cls+'" data-act="qa" data-id="'+i+':'+j+'">'+esc(op)+'</button>';
    });
    if(quiz.graded){if(quiz.ans[i]===q.c)score++;out+='<p class="muted" style="margin:8px 0 0">'+(quiz.ans[i]===q.c?'✅ ':'❌ ')+esc(q.e)+'</p>'}
    out+='</div>';

  out+='<div class="row wrap" style="margin-top:14px"><button class="btn ghost" data-act="close">Cerrar</button>'+
    (quiz.graded?'<button class="btn ghost" data-act="t-ex" style="margin-left:auto">'+ic('sparkle')+'Explícamelo</button><button class="btn" data-act="q-again">Otro examen</button>':
     n?'<button class="btn" data-act="q-grade" style="margin-left:auto"'+(answered<n?' disabled':'')+'>Calificar ('+answered+'/'+n+')</button>':(quiz.err?'<button class="btn" data-act="q-again" style="margin-left:auto">Intentar otra vez</button>':''))+'</div></div>';
  openModal(out);$('#sheet').scrollTop=top;
}

  var u=usage(),lim=LIM[isPro()?'pro':'free'],n=kind==='tutor'?u.t:u.q,max=lim[kind];
  if(n>=max){limitModal(kind);return false}
  if(kind==='tutor')u.t++;else u.q++;
  save();return true;
}
function usageLine(){
  var u=usage(),lim=LIM[isPro()?'pro':'free'];

var NUMW=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'],NUMWE=['zero','one','two','three','four','five','six','seven','eight','nine'];
function newGate(){var a=3+Math.floor(Math.random()*7),b=3+Math.floor(Math.random()*7);return {x:a,y:b,a:a*b}}
function lockUntil(){var v=+lsGet('sf.vlock')||0;return v>Date.now()?v:0}
function startVerify(){
  if(MODE!=='parent')return;
  if(!SAMPLE&&!(config&&config.pin)){
    formPin(function(){startVerify()});
    toast('Primero crea un PIN de familia: lo pediremos al activar Pro.');return;
  }
  verify={step:1,gate:newGate(),fails:0,cycle:'month',err:''};drawVerify();
}
function drawVerify(){
  if(!verify)return;
  var y=new Date().getFullYear(),lu=lockUntil();
  if(verify.step===1){
    openModal('<h3>'+ic('lock')+'Verificación de adulto</h3><p class="muted" style="margin:0 0 6px">Paso 1 de 2. La IA de Pro la activa una madre, un padre o un tutor legal.</p>'+
      (lu?'<div class="card" style="margin:10px 0;background:var(--bad-soft);box-shadow:none;color:var(--bad)">Demasiados intentos. Intenta de nuevo a las '+new Date(lu).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'})+'.</div>':'')+
      '<label for="v1">Año de nacimiento</label><input id="v1" type="number" inputmode="numeric" min="1900" max="'+y+'" placeholder="Ej. 1985">'+
      '<label for="v2">Escribe en números el resultado de: <b>'+(LANG==='en'?NUMWE[verify.gate.x]+' times '+NUMWE[verify.gate.y]:NUMW[verify.gate.x]+' por '+NUMW[verify.gate.y])+'</b></label><input id="v2" type="number" inputmode="numeric" autocomplete="off">'+
      (SAMPLE?'':'<label for="v3">PIN de la familia</label><input id="v3" type="password" inputmode="numeric" maxlength="6" autocomplete="off">')+
      '<label class="check" style="display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:14px;margin-top:14px;background:var(--primary-soft);padding:10px 12px;border-radius:11px"><input type="checkbox" id="v4" style="width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--primary)"><span>Soy madre, padre o tutor legal, mayor de 18 años, y autorizo que mi hijo o hija use la IA de StudyFlow Pro.</span></label>'+
      (verify.err?'<p style="color:var(--bad);font-size:14px">'+esc(verify.err)+'</p>':'')+
      '<div class="row" style="margin-top:18px"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="v-check" style="margin-left:auto"'+(lu?' disabled':'')+'>Continuar</button></div>');
    return;
  }
  var price=verify.cycle==='year'?'$35 al año':'$3.99 al mes';
  openModal('<h3>'+ic('star')+'Activar Pro</h3><p class="muted" style="margin:0 0 6px">Paso 2 de 2. ✅ Verificación de adulto completada.</p>'+
    '<label>Elige cómo pagar</label><div class="chips"><button class="chipb'+(verify.cycle==='month'?' on':'')+'" data-act="v-cycle" data-id="month">Mensual · $3.99</button><button class="chipb'+(verify.cycle==='year'?' on':'')+'" data-act="v-cycle" data-id="year">Anual · $35 (ahorras 27%)</button></div>'+
    '<div class="card" style="margin:10px 0 0;background:var(--warn-soft);box-shadow:none;color:var(--warn-text);line-height:1.45"><b>Versión de prueba: no se cobra nada.</b><br>En la versión final, aquí se abrirá la página segura de la pasarela de pago (por ejemplo Wompi o PayPal) para ingresar la tarjeta. El pago con tarjeta también sirve como segunda confirmación de que quien activa es un adulto.</div>'+
    '<div class="row" style="margin-top:18px"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="v-activate" style="margin-left:auto">Activar Pro de prueba · '+price+'</button></div>');
}
function verifyCheck(){
  if(!verify||lockUntil())return;
  var y=parseInt($('#v1').value,10),g=parseInt($('#v2').value,10),ok=$('#v4').checked,pin=$('#v3')?$('#v3').value.trim():'',now=new Date().getFullYear();
  function fail(msg){
    verify.fails++;verify.gate=newGate();verify.err=msg;
    if(verify.fails>=3){lsSet('sf.vlock',String(Date.now()+10*60000));verify.fails=0;verify.err=''}
    drawVerify();
  }
  if(!y||y<1900||y>now){verify.err='Escribe un año de nacimiento válido.';drawVerify();return}
  if(now-y<18){lsSet('sf.vlock',String(Date.now()+10*60000));verify.err='';drawVerify();return}
  if(g!==verify.gate.a){fail('El resultado no es correcto. Prueba con esta nueva operación.');return}
  if(!ok){verify.err='Marca la casilla de autorización para continuar.';drawVerify();return}
  if(SAMPLE){verify.step=2;verify.err='';drawVerify();return}
  hashPin(pin).then(function(h){if(!config||h!==config.pin){fail('El PIN no es correcto.');return}verify.step=2;verify.err='';drawVerify()});
}
function setPlan(o){
  if(SAMPLE){demo.plan=o;softRender();return Promise.resolve(true)}
  if(!DB){toast('Necesitas abrir la app con tu cuenta de Claude.');return Promise.resolve(false)}
  return DB.doc('family/plan').set(o).then(function(){planDoc=o;softRender();return true},function(e){writeErr(e);return false});
}
function activatePro(){
  if(!verify||verify.step!==2)return;
  var cyc=verify.cycle;verify=null;
  setPlan({plan:'pro',cycle:cyc,since:Date.now(),verifiedAt:Date.now(),test:true}).then(function(ok){
    if(!ok)return;
    closeModal();toast('¡Pro activado para toda la familia! 🚀');
    stList().forEach(function(st){dbAdd('notes',{student:st.id,kind:'pro',title:'¡Tu familia activó StudyFlow Pro! 🚀',text:'Ahora tienes más preguntas al tutor de IA, mini exámenes y puedes subir fotos del temario.',subject:'',at:Date.now(),read:false,done:false})});
    NOTES().filter(function(n){return n.kind==='solicitud'&&!n.read}).forEach(function(n){dbUpd('notes',n.id,{read:true})});
  });
}

var PLAN=[[7,'media','Repasa apuntes y haz un resumen o mapa mental.'],[3,'media','Practica ejercicios o preguntas tipo examen.'],[1,'alta','Repaso final ligero y duerme bien.']];
function makePlan(ex){
  var n=0;
  PLAN.forEach(function(p){
    var due=shift(ex.due,-p[0]);if(diffDays(due)<0)return;
    S.tasks.push({id:uid(),title:'Repaso: '+ex.title,subject:ex.subject,type:'Repaso',prio:p[1],due:due,note:p[2],done:false,parent:ex.id,off:p[0]});n++;
  });
  return n;
}

function formGrade(id){

   '<div><label for="f4">Nota máxima</label><input type="number" step="any" id="f4" value="'+g.max+'" inputmode="decimal"></div></div>'+
   '<div class="grid2" style="margin:0"><div><label for="f5">Peso (importancia)</label><input type="number" step="any" min="0.1" id="f5" value="'+g.weight+'"></div>'+

function formCalc(){
  if(needSubject())return;
  openModal('<h3>'+ic('target')+'¿Cuánto necesito sacar?</h3><label for="f1">Materia</label><select id="f1">'+subjOptions(gradeSubj!=='all'?gradeSubj:S.subjects[0].id)+'</select>'+
   '<div class="grid2" style="margin:0"><div><label for="f2">Meta final (/'+S.settings.max+')</label><input type="number" id="f2" step="any" value="'+r1(toScale(S.settings.goal))+'"></div>'+
   '<div><label for="f3">Peso de lo que falta</label><input type="number" id="f3" step="any" value="1" min="0.1"></div></div>'+
   '<div id="res" class="card" style="margin:14px 0 0;background:var(--primary-soft);box-shadow:none"></div><div class="row" style="margin-top:14px"><button class="btn ghost" data-act="close" style="margin-left:auto">Cerrar</button></div>');
  function calc(){
    var id=$('#f1').value,goal=parseFloat($('#f2').value)/S.settings.max*100,w=parseFloat($('#f3').value)||1,tw=0,tp=0;
    subjGrades(id).forEach(function(g){var x=+g.weight||1;tw+=x;tp+=pct(g)*x});
    var need=(goal*(tw+w)-tp)/w;

  if(c&&c.parentNode.id==='colors'){pickedColor=c.dataset.c;var all=c.parentNode.children;for(var i=0;i<all.length;i++)all[i].classList.toggle('sel',all[i]===c);return}
  var el=e.target.closest('[data-act],[data-v]');if(!el)return;
  if(el.dataset.v){view=el.dataset.v;render();window.scrollTo(0,0);return}
  var a=el.dataset.act,id=el.dataset.id;
  if(el.type==='checkbox')return;
  switch(a){
    case 'close':closeModal();break;
    case 'auth-tab':AUTH.tab=id;AUTH.err='';render();break;
    case 'auth-login':case 'auth-signup':case 'auth-google':case 'auth-reset':case 'ob-parent':case 'ob-join':case 'ob-join-parent':authAction(a);break;
    case 'logout':closeModal();SAMPLE=false;demo=null;F()&&F().signOut&&F().signOut();break;
    case 'fam-code':showFamilyCode();break;
    case 'copy-code':if(AUTH.fam&&AUTH.fam.code)copyText(AUTH.fam.code,'Código copiado ✅');break;
    case 'lang':setLang(id);break;
    case 'settings':formSettings();break;
    case 'role-student':chooseStudent();break;
    case 'role-parent':enterParent();break;
    case 'be-st':becomeStudent(id);break;
    case 'pin':formPin(null);break;
    case 'demo':startDemo();break;
    case 'demo-exit':exitDemo();break;
    case 'demo-switch':MODE=MODE==='student'?'parent':'student';view=MODE==='parent'?'p_home':'home';render();window.scrollTo(0,0);break;
    case 'new-subject':formSubject();break;
    case 'edit-subject':formSubject(id);break;
    case 'edit-task':formTask(id);break;
    case 'edit-grade':formGrade(id);break;
    case 'edit-read':formRead(id);break;
    case 'new-read':formRead();break;
    case 'manual':formManual();break;
    case 'calc':formCalc();break;
    case 'filter':tasksFilter=id;render();break;
    case 'gfilter':gradeSubj=id;render();break;
    case 'period':period=+id;render();break;
    case 'share':copyText(reportText(),'Resumen copiado. Pégalo en WhatsApp o en un correo.');break;
    case 'pick-st':pickStudent(id);render();break;
    case 'note':formNote(id);break;
    case 'cheer':formNote('felicitacion',T('¡Felicidades por tu logro: '+id+'!')+' 🏅');break;
    case 'new-reward':formReward();break;
    case 'ideas':genIdeas();break;
    case 'idea-send':
      var it=ideas.items&&ideas.items[+id];if(!it)break;
      var sj=S.subjects.filter(function(s){return it.materia&&s.name.toLowerCase()===it.materia.toLowerCase()})[0];
      dbAdd('notes',{student:sidOf(),kind:it.tipo==='libro'?'libro':'consejo',title:it.titulo,text:it.detalle,subject:sj?sj.id:'',at:Date.now(),read:false,done:false})
        .then(function(ok){if(ok){ideas.sent[+id]=1;softRender();toast('Enviado 💌')}});
      break;
    case 'n-read':dbUpd('notes',id,{read:true});break;
    case 'n-done':dbUpd('notes',id,{done:true,read:true}).then(function(ok){if(ok)toast('¡Bien hecho! ✅')});break;
    case 'n-del':ask('Se eliminará este mensaje.','Eliminar',function(){dbDel('notes',id)});break;
    case 'all-notes':
      openModal('<h3>'+ic('mail')+'Mensajes de tu familia</h3><div style="margin-top:10px">'+myNotes().map(function(n){return noteHtml(n,n.kind==='recordatorio'&&!n.done?'<button class="btn famb small" data-act="n-done" data-id="'+n.id+'">Ya lo hice ✓</button>':'')}).join('')+'</div><div class="row"><button class="btn ghost" data-act="close" style="margin-left:auto">Cerrar</button></div>');
      break;
    case 'deliver':
      var rw=REWARDS().filter(function(r){return r.id===id})[0];if(!rw)break;
      dbUpd('rewards',id,{delivered:true,deliveredAt:Date.now(),achievedAt:rw.achievedAt||Date.now()}).then(function(ok){
        if(!ok)return;
        dbAdd('notes',{student:rw.student,kind:'premio',title:'¡Ganaste tu premio: '+rw.title+'!',text:'Lo lograste con tu esfuerzo: '+(RKIND[rw.kind]?RKIND[rw.kind].d(rw):'')+'. ¡Felicidades!',subject:'',at:Date.now(),read:false,done:false});
        toast('Premio entregado 🎉');
      });
      break;
    case 'r-ach':dbUpd('rewards',id,{achievedAt:Date.now()});break;
    case 'r-del':ask('Se eliminará este premio.','Eliminar',function(){dbDel('rewards',id)});break;
    case 'tq':
      var q=QUICK[+id],ta=$('#tq');if(!q||!ta)break;
      if(ta.value.trim())tSend(q[1]+ta.value);else{ta.value=q[1];ta.focus()}
      break;
    case 't-send':var t2=$('#tq');tSend(t2?t2.value:'');break;
    case 't-stop':if(tutor.ctl)tutor.ctl.abort();break;
    case 't-new':tutor.msgs=[];tutor.err='';render();break;
    case 'del-subject':ask('Se eliminará la materia con sus tareas, notas y lecturas.','Eliminar',function(){
        S.subjects=S.subjects.filter(function(x){return x.id!==id});S.tasks=S.tasks.filter(function(x){return x.subject!==id});
        S.grades=S.grades.filter(function(x){return x.subject!==id});S.reads=S.reads.filter(function(x){return x.subject!==id});S.topics=S.topics.filter(function(x){return x.subject!==id});
        S.sessions.forEach(function(x){if(x.subject===id)x.subject=''});if(gradeSubj===id)gradeSubj='all';save();render()});break;
    case 'del-task':
      var kids=S.tasks.filter(function(x){return x.parent===id}).length;
      ask(kids?'Se eliminará este examen y sus '+kids+' sesiones de repaso.':'Se eliminará esta actividad.','Eliminar',function(){S.tasks=S.tasks.filter(function(x){return x.id!==id&&x.parent!==id});save();render()});break;
    case 'del-grade':ask('Se eliminará esta nota.','Eliminar',function(){S.grades=S.grades.filter(function(x){return x.id!==id});save();render()});break;
    case 'del-read':ask('Se eliminará este horario de lectura.','Eliminar',function(){S.reads=S.reads.filter(function(x){return x.id!==id});save();render()});break;
    case 'subtab':subTab=id;render();break;
    case 'wk':weekOff+=+id;render();break;
    case 'tsf':topicSubj=id;render();break;
    case 'temario':formTemario();break;
    case 'topic':formTopic(id);break;
    case 'conf':var tt=topicById(curTopic);if(tt){tt.conf=+id;save();formTopic(curTopic);render()}break;
    case 't-study':studyTopic(id,'ex');break;
    case 't-ex':studyTopic(curTopic,'ex');break;
    case 't-sum':studyTopic(curTopic,'sum');break;
    case 't-quiz':startQuiz(curTopic);break;
    case 'qa':if(quiz&&!quiz.graded){var pp=id.split(':');quiz.ans[+pp[0]]=+pp[1];drawQuiz()}break;
    case 'q-grade':gradeQuiz();break;
    case 'q-again':startQuiz(quiz&&quiz.id);break;
    case 'topic-help':var th=topicById(id);if(th){helpSubj=th.subject;helpTopic=th.id;view='p_help';render();window.scrollTo(0,0)}break;
    case 'hs':helpSubj=id;helpTopic='';render();break;
    case 'ht':helpTopic=helpTopic===id?'':id;render();break;
    case 'h-msg':var hm=topicById(helpTopic),hsj=subj(helpSubj);formNote('consejo',hm?T('Te ayudo con: ')+hm.title:T('Te ayudo con ')+(hsj?hsj.name:''),helpSubj,helpTopic);break;
    case 'h-book':formNote('libro','',helpSubj,helpTopic);break;
    case 'h-rem':var hr=topicById(helpTopic),hs2=subj(helpSubj);formNote('recordatorio',T('Repasar: ')+(hr?hr.title:(hs2?hs2.name:'')),helpSubj,helpTopic);break;
    case 'h-guide':genGuide(false);break;
    case 'h-guide2':genGuide(true);break;
    case 'h-copy':if(guide&&guide.text)copyText(guide.text,'Guía copiada ✅');break;
    case 'tem-ai':temDetect();break;
    case 'tem-manual':temRead();tem.items=[{title:'',w:1}];drawTem();break;
    case 'tem-add':temSync();tem.items.push({title:'',w:tem.items.length?tem.items[tem.items.length-1].w:1});drawTem();break;
    case 'tem-del':temSync();tem.items.splice(+id,1);drawTem();break;
    case 'tem-back':tem.items=null;drawTem();break;
    case 'tem-save':temSave();break;
    case 'del-topic':ask('Se eliminará este tema.','Eliminar',function(){S.topics=S.topics.filter(function(x){return x.id!==id});save();render()});break;
    case 'plans':openPlans();break;
    case 'go-pro':startVerify();break;
    case 'v-check':verifyCheck();break;
    case 'v-cycle':verify.cycle=id;drawVerify();break;
    case 'v-activate':activatePro();break;
    case 'pro-cancel':ask('Volverás al plan Gratis. La IA tendrá los límites gratuitos.','Cancelar Pro',function(){setPlan({plan:'free',since:Date.now()}).then(function(ok){if(ok)toast('Ahora estás en el plan Gratis')})});break;
    case 'ask-pro':askPro();break;
    case 'req-ok':dbUpd('notes',id,{read:true});break;
    case 'export':exportData();break;
    case 'import':importData();break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='tsubj'){tutor.subject=el.value;return}
  if(!el.dataset||!el.dataset.act)return;
  var id=el.dataset.id;
  if(el.dataset.act==='toggle'){
    var t=S.tasks.filter(function(x){return x.id===id})[0];
    if(t){t.done=el.checked;t.doneAt=el.checked?ymd(new Date()):null;save();
      if(el.checked)toast(diffDays(t.due)>=0?'¡Bien hecho! Entregada a tiempo ✅':'Completada ✅');
      setTimeout(render,el.checked?250:0)}
  }
  if(el.dataset.act==='read-done'){
    var r=S.reads.filter(function(x){return x.id===id})[0],k=ymd(new Date());
    if(r){if(el.checked)r.done[k]=1;else delete r.done[k];save();render()}
  }
});
document.addEventListener('keydown',function(e){if(e.target&&e.target.id==='tq'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();tSend(e.target.value)}});
$('#fab').onclick=function(){if(view==='tasks')formTask();else if(view==='subjects'){if(subTab==='temario')formTemario();else formSubject()}else if(view==='grades')formGrade()};

render();
initCloud();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
setTimeout(checkReminders,1500);
})();
</script>
<script src="firebase-config.js"></script>
<script type="module" src="firebase.js"></script>
</body>
